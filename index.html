<style id="evo18-architectural-luxury">
/* EVO18 Architectural Luxury — stronger visual identity, entirely static.
   Large tonal planes replace the barely-visible grid. */
html, body {
  background:#141213 !important;
  background-image:none !important;
}

body {
  position:relative;
  isolation:isolate;
  overflow-x:hidden;
  background:
    linear-gradient(180deg,#181617 0%,#141213 52%,#101011 100%) !important;
}

/* Large architectural planes. They deliberately have visible tonal separation,
   but remain soft enough to keep typography and product imagery dominant. */
body::before {
  content:"";
  position:absolute;
  inset:0;
  z-index:-2;
  pointer-events:none;
  background:
    linear-gradient(126deg,
      transparent 0%,
      transparent 24%,
      rgba(255,255,255,.025) 24.1%,
      rgba(255,255,255,.025) 43%,
      transparent 43.1%,
      transparent 100%
    ),
    linear-gradient(54deg,
      transparent 0%,
      transparent 54%,
      rgba(105,29,43,.075) 54.1%,
      rgba(105,29,43,.075) 71%,
      transparent 71.1%,
      transparent 100%
    ),
    linear-gradient(90deg,
      rgba(255,255,255,.018) 0%,
      rgba(255,255,255,.018) 31%,
      transparent 31.1%,
      transparent 68%,
      rgba(255,255,255,.012) 68.1%,
      rgba(255,255,255,.012) 100%
    );
}

/* Structural panel seams. */
body::after {
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    linear-gradient(90deg,
      transparent 0,
      transparent calc(31% - .5px),
      rgba(255,255,255,.08) 31%,
      transparent calc(31% + .5px),
      transparent calc(68% - .5px),
      rgba(255,255,255,.045) 68%,
      transparent calc(68% + .5px),
      transparent 100%
    ),
    linear-gradient(180deg,
      transparent 0,
      transparent 33%,
      rgba(255,255,255,.028) 33.1%,
      transparent 33.2%,
      transparent 68%,
      rgba(255,255,255,.022) 68.1%,
      transparent 68.2%,
      transparent 100%
    );
  opacity:.9;
}

/* Keep content sections visually unified. */
main > section,
.page > section,
.hero, .hero-section, .product-hero, .product-showcase,
.product-configurator, .configurator, .product-detail, .product-section,
.accessories, .accessories-section, .accessory-section,
.blog, .blog-section, .journal, .article, .article-page {
  background:transparent !important;
  background-image:none !important;
}

/* Stronger showroom floor plane beneath hero product. */
.hero::before, .hero-section::before, .product-hero::before,
.product-showcase::before, .product-configurator::before,
.configurator::before, .product-detail::before, .product-section::before {
  content:"";
  position:absolute;
  z-index:-1;
  width:min(700px,68vw);
  height:190px;
  left:50%;
  bottom:-2%;
  transform:translateX(-50%);
  background:
    linear-gradient(180deg,
      rgba(255,255,255,.025),
      rgba(255,255,255,0)
    );
  border-top:1px solid rgba(255,255,255,.045);
  border-radius:0;
  pointer-events:none;
}

/* Light-theme variant retains the same architecture. */
[data-theme="light"] body, html.light body {
  background:
    linear-gradient(180deg,#e5e0d8 0%,#ddd7ce 52%,#d4cdc3 100%) !important;
}
[data-theme="light"] body::before, html.light body::before {
  background:
    linear-gradient(126deg,
      transparent 0%, transparent 24%,
      rgba(255,255,255,.22) 24.1%,
      rgba(255,255,255,.22) 43%,
      transparent 43.1%, transparent 100%
    ),
    linear-gradient(54deg,
      transparent 0%, transparent 54%,
      rgba(105,29,43,.055) 54.1%,
      rgba(105,29,43,.055) 71%,
      transparent 71.1%, transparent 100%
    ),
    linear-gradient(90deg,
      rgba(255,255,255,.16) 0%, rgba(255,255,255,.16) 31%,
      transparent 31.1%, transparent 68%,
      rgba(255,255,255,.08) 68.1%, rgba(255,255,255,.08) 100%
    );
}
[data-theme="light"] body::after, html.light body::after {
  background:
    linear-gradient(90deg,
      transparent 0, transparent calc(31% - .5px),
      rgba(0,0,0,.07) 31%, transparent calc(31% + .5px),
      transparent calc(68% - .5px), rgba(0,0,0,.045) 68%,
      transparent calc(68% + .5px), transparent 100%
    ),
    linear-gradient(180deg,
      transparent 0, transparent 33%, rgba(0,0,0,.025) 33.1%,
      transparent 33.2%, transparent 68%, rgba(0,0,0,.02) 68.1%,
      transparent 68.2%, transparent 100%
    );
}

/* No moving effects: architecture remains GPU-light and stable. */
@media (prefers-reduced-motion: reduce) {
  body::before, body::after { opacity:.5; }
}
</style>

ounts of local storage\nA larger overall phone format\nThe smaller Pro can suit customers who want Pro capabilities in a more compact form factor.\nBefore You Buy\nCheck the exact storage and colour selected, current availability, final price, delivery terms and applicable warranty/support arrangements.\nFor an online purchase, also make sure the checkout clearly shows the complete configuration and total before you place the order.\nFinal Takeaway\nThe right iPhone 18 Pro Max configuration depends on how you use your phone. Start with the display and model preference, then choose storage based on your actual usage rather than automatically choosing the largest capacity.\n<a class="btn primary" href="#/models/pro-max">Explore iPhone 18 Pro Max</a>iPhone 18 Pro vs iPhone 18 Pro Max: What's the Difference?\nSEO Title: iPhone 18 Pro vs iPhone 18 Pro Max | EVO18\nPrimary Keyword: iPhone 18 Pro vs iPhone 18 Pro Max\nURL: /blog/iphone-18-pro-vs-pro-max\nMeta Description: Compare iPhone 18 Pro and iPhone 18 Pro Max by display, battery, storage, cameras, size and price.\nChoosing between iPhone 18 Pro and iPhone 18 Pro Max comes down to more than the name. Both models share the same Pro-generation foundation, but they differ in physical size, display size, battery endurance and the way they fit into everyday use.\niPhone 18 Pro vs Pro Max at a Glance\n| Feature | iPhone 18 Pro | iPhone 18 Pro Max |\n| Display | 6.3-inch | 6.9-inch |\n| Chip | A20 Pro | A20 Pro |\n| Camera | 48MP Pro Fusion system | 48MP Pro Fusion system |\n| Front camera | 18MP Center Stage | 18MP Center Stage |\n| Storage | 256GB–2TB | 256GB–2TB |\n| Battery rating | Up to 24 hrs typical use / 36 hrs video playback | Up to 30 hrs typical use / 45 hrs video playback |\n| Starting EVO18 demo price | LKR 499,900 | LKR 529,900 |\nDisplay Size\nThe clearest difference is the display. The iPhone 18 Pro has a 6.3-inch Super Retina XDR OLED display, while the Pro Max has a 6.9-inch display.\nA larger screen can b  same storage range:\n256GB — LKR 529,900\n512GB — LKR 609,900\n1TB — LKR 729,900\n2TB — LKR 929,900\nThe best way to compare the prices is to select the model and storage together because the Pro Max has a different base price.\nDo You Need 1TB or 2TB?\nNot necessarily.\nIf your phone is mainly used for communication, photography, social media, streaming and ordinary apps, 256GB or 512GB may be sufficient.\nHigher capacities become more relevant when you regularly shoot and retain large amounts of high-resolution video, work with large files or prefer to keep most of your content locally.\nA Simple Way to Decide\nAsk yourself three questions:\n1. How much storage is your current phone using?\n2. How quickly are you filling it?\n3. Do you regularly delete or move large files?\nIf your current device is already close to full, moving to the next capacity can provide more useful headroom.\n\n5. iPhone 18 Pro Colours: Complete Guide to the Available Finishes\nSEO Title: iPhone 18 Pro Colours: Black, Silver, Glacier & Burgundy | EVO18\nPrimary Keyword: iPhone 18 Pro colours\nURL: /blog/iphone-18-pro-colours\nMeta Description: Explore the iPhone 18 Pro colours available through EVO18, including Black, Silver, Glacier and Burgundy.\nThe colour you choose is one of the most visible parts of your new iPhone. The iPhone 18 Pro generation is presented in four finishes: Black, Silver, Glacier and Burgundy.\nAll four give the Pro range a different visual character, while the underlying phone configuration remains the same apart from the selected model and storage.\nBlack\nBlack is the understated option for customers who prefer a darker, minimalist appearance.\nIt pairs easily with a wide range of cases and accessories and gives the phone a classic look.\nSilver\nSilver offers a clean, bright finish that highlights the phone's refined Pro design.\nIt is a versatile choice for customers who prefer a lighter appearance.\nGlacier\nGlacier provides a cooler, more distinctive finish hop.\n\nHowever, buying online means you should pay particular attention to the information presented before checkout. A trustworthy online buying experience should make it clear who the seller is, how to contact them, what product you are receiving, how delivery works and what happens if there is a problem with the order.\n\nBefore paying, review the seller's terms and make sure the final price and selected configuration are clearly displayed.\n4. Imported or Grey-Market Devices\nSri Lankan customers may also encounter imported devices sold outside an authorised local retail channel. These products can sometimes be offered at different prices or with different availability.\n\nThat does not by itself tell you whether a particular purchase is suitable. Instead, check the details that affect your ownership experience: the exact model and region, warranty coverage, compatibility, return terms, invoice, activation status and after-sales support.\n\nIf a price is significantly different from other listings, ask why before making the purchase.\nWhat Should You Check Before Buying an iPhone?\nWhether you are buying from a physical retailer or online, use a simple checklist before you pay:\nIs the device new, used, refurbished or otherwise previously activated?\nWhat is the exact iPhone model and storage capacity?\nWhich colour and configuration are you receiving?\nWhat warranty applies, and who provides it?\nWhat is the return and exchange policy?\nIs the advertised price the final price?\nAre delivery charges included?\nWill you receive a proper invoice or proof of purchase?\nHow can you contact the seller if something goes wrong?\nIf the device is imported, what regional or model-specific considerations should you know about?\nPrice Is Only One Part of the Purchase\nThe lowest advertised price is not necessarily the lowest-risk purchase. Compare the complete package: the device itself, warranty, return terms, delivery, payment arrangements, customer support and the sell function setHeroProduct(model,colour,button){
  const img=document.getElementById('heroProductImage');
  if(!img)return;
  heroModel=model;
  heroColour=colour;
  const key=model+'-'+colour.toLowerCase();
  const file=key+'.webp';
  document.querySelectorAll('.hero-model-switch button').forEach(b=>b.classList.remove('active'));
  if(button)button.classList.add('active');
  document.querySelectorAll('.hero-colour').forEach(b=>b.classList.toggle('active',b.dataset.colour===colour));
  img.classList.add('is-changing');
  const swap=()=>{
    img.src='./assets/phones/'+file;
    img.alt='iPhone 18 '+(model==='max'?'Pro Max':'Pro')+' '+colour;
    document.getElementById('heroProductName').textContent='iPhone 18 '+(model==='max'?'Pro Max':'Pro');
    document.getElementById('heroProductColour').textContent=colour;
    requestAnimationFrame(()=>img.classList.remove('is-changing'));
  };
  const cached=heroImageCache[key];
  if(cached && cached.complete) swap();
  else if(cached) cached.onload=swap;
  else swap();
}

const EVO18_FULL_BLOGS=[["iPhone 18 Pro Price in Sri Lanka: Complete Guide","iPhone 18 Pro Price in Sri Lanka: Complete Guide\nSEO Title: iPhone 18 Pro Price in Sri Lanka | EVO18\nPrimary Keyword: iPhone 18 Pro price in Sri Lanka\nURL: /blog/iphone-18-pro-price-sri-lanka\nMeta Description: Explore iPhone 18 Pro pricing in Sri Lanka by storage, compare configurations and see what to check before buying.\nIf you're researching the iPhone 18 Pro price in Sri Lanka, the most useful comparison is the complete configuration rather than a single starting price. The amount you pay can vary by storage, availability and the seller's current pricing.\n\nAt EVO18, the iPhone 18 Pro catalogue is structured around four storage options: 256GB, 512GB, 1TB and 2TB.\n\nCurrent EVO18 demo pricing\n256GB — LKR 499,900\n512GB — LKR 579,900\n1TB — LKR 699,900\n2TB — LKR 899,900\n\nThese are EVO18 demo prices for the website experience and should not be presented as official Apple Sri Lanka pricing. The live EVO18 product page should remain the source of the current selling price once commercial pricing is confirmed.\n\nWhat changes the iPhone 18 Pro price?\nStorage is the main configuration variable in the EVO18 catalogue. A higher-capacity model costs more because it provides more built-in space for photographs, video, apps and files. Colour does not automatically change the base price unless a specific live configuration is priced differently.\n\nWhich storage should you choose?\n256GB is a practical starting point for everyday use, including photography, messaging, streaming and apps.\n\n512GB provides more room for customers who keep larger photo and video libraries or more content offline.\n\n1TB is better suited to heavier media use, large files and creative workflows.\n\n2TB is the maximum capacity in the EVO18 catalogue and is most relevant to customers who regularly keep very large amounts of media and files locally.\n\nWhat should you check before buying?\nConfirm the exact model, storage, colour, current price, availability, warranty terms and delivery conditions before ordering. For an online purchase, make sure the selected configuration and total are clearly shown before checkout.\n\nExplore the iPhone 18 Pro product page to see the available configurations and current EVO18 pricing."],["iPhone 18 Pro Max Price in Sri Lanka: Storage & Buying Guide","iPhone 18 Pro Max Price in Sri Lanka: Storage & Buying Guide\nSEO Title: iPhone 18 Pro Max Price in Sri Lanka | EVO18\nPrimary Keyword: iPhone 18 Pro Max price in Sri Lanka\nURL: /blog/iphone-18-pro-max-price-sri-lanka\nMeta Description: See iPhone 18 Pro Max pricing in Sri Lanka by storage and learn which configuration fits your needs before ordering.\nThe iPhone 18 Pro Max is the larger model in the iPhone 18 Pro generation. If you're comparing the iPhone 18 Pro Max price in Sri Lanka, storage is one of the main factors to consider alongside availability and the seller's current price.\n\nCurrent EVO18 demo pricing\n256GB — LKR 529,900\n512GB — LKR 609,900\n1TB — LKR 729,900\n2TB — LKR 929,900\n\nThese are EVO18 demo prices used for the website experience. They are not official Apple Sri Lanka prices and should be replaced with confirmed live selling prices before launch.\n\nWhy does storage affect the price?\nHigher storage provides more room for photographs, video, apps, games and other files. 256GB can be enough for many everyday users, while 512GB, 1TB and 2TB become more useful as your local media and file library grows.\n\nPro Max vs Pro\niPhone 18 Pro Max has a 6.9-inch display, while iPhone 18 Pro has a 6.3-inch display. Both models use A20 Pro and share the same broad Pro camera platform in the EVO18 catalogue. The Pro Max is therefore primarily a choice for customers who prefer the larger form factor, longer battery endurance and larger-screen experience.\n\nBefore you order\nCheck the exact storage and colour, current availability, final price, delivery terms and applicable warranty or support arrangements. Make sure the complete configuration is visible before checkout.\n\nExplore iPhone 18 Pro Max on EVO18 to compare the available storage options and current configuration pricing."],["iPhone 18 Pro vs iPhone 18 Pro Max: What's the Difference?","iPhone 18 Pro vs iPhone 18 Pro Max: What's the Difference?\nSEO Title: iPhone 18 Pro vs iPhone 18 Pro Max | EVO18\nPrimary Keyword: iPhone 18 Pro vs iPhone 18 Pro Max\nURL: /blog/iphone-18-pro-vs-pro-max\nMeta Description: Compare iPhone 18 Pro and iPhone 18 Pro Max by display, battery, storage, cameras, size and EVO18 demo pricing.\nChoosing between iPhone 18 Pro and iPhone 18 Pro Max comes down mainly to size, battery requirements, storage needs and how you prefer to use your phone. Both sit within the same Pro generation.\n\nAt a glance\nDisplay — iPhone 18 Pro: 6.3-inch | iPhone 18 Pro Max: 6.9-inch\nChip — A20 Pro on both models\nCamera — 48MP Pro Fusion camera system on both models\nFront camera — 18MP Center Stage on both models\nStorage — 256GB, 512GB, 1TB and 2TB\nEVO18 demo price — Pro from LKR 499,900 | Pro Max from LKR 529,900\n\nDisplay and size\nThe 6.3-inch iPhone 18 Pro is the more compact option. The 6.9-inch Pro Max provides more screen area for video, gaming, photography and productivity.\n\nPerformance\nBoth models use A20 Pro, so choosing the Pro Max does not mean moving to a different performance tier within the range.\n\nCamera system\nBoth models use the 48MP Pro Fusion camera platform described in the EVO18 catalogue, including a 48MP Fusion Main camera with variable aperture, Ultra Wide and Telephoto cameras.\n\nBattery\nThe EVO18 comparison information lists up to 36 hours of video playback for iPhone 18 Pro and up to 45 hours for iPhone 18 Pro Max. Actual battery life varies with settings, network conditions and usage.\n\nWhich model fits?\nChoose iPhone 18 Pro if a more compact Pro phone is your priority. Choose iPhone 18 Pro Max if you prefer a larger display and place more emphasis on battery endurance and the larger form factor. Storage should be selected separately based on how much content you keep locally.\n\nUse the EVO18 comparison page to review the two models side by side before choosing your configuration."],["iPhone 18 Pro Storage Guide: 256GB vs 512GB vs 1TB vs 2TB","iPhone 18 Pro Storage Guide: 256GB vs 512GB vs 1TB vs 2TB\nSEO Title: iPhone 18 Pro Storage Guide: 256GB vs 512GB vs 1TB vs 2TB | EVO18\nPrimary Keyword: iPhone 18 Pro storage\nURL: /blog/iphone-18-pro-storage-guide\nMeta Description: Compare iPhone 18 Pro storage options from 256GB to 2TB and choose the capacity for your photos, video, apps and files.\nStorage is one of the most important iPhone 18 Pro decisions because you normally cannot add internal storage later. The right capacity depends on how much content you keep on your phone and how often you work with large files.\n\nThe EVO18 catalogue offers 256GB, 512GB, 1TB and 2TB on both iPhone 18 Pro and iPhone 18 Pro Max.\n\n256GB\nA practical starting point for everyday users who mainly use their phone for photography, messaging, streaming, apps and ordinary files.\n\n512GB\nA useful step up for customers who capture more photos and video, keep more content offline or want additional room without moving to the largest capacities.\n\n1TB\nA strong fit for heavy media users, creators and customers who regularly work with large video files, high-resolution photography or large local libraries.\n\n2TB\nThe maximum storage option in the EVO18 catalogue. It is most relevant to professional or very heavy users who want to keep substantial amounts of media and files locally.\n\nHow do you choose?\nCheck how much storage your current phone uses and how quickly you are filling it. If your current device is frequently close to full, moving to the next capacity gives you more headroom.\n\nStorage also affects price. Higher capacities have higher EVO18 demo prices, so choosing the largest option only makes sense when you will actually use the additional space.\n\nFor the current configuration and price, select your model and storage on the EVO18 product page."],["iPhone 18 Pro Colours: Black, Silver, Glacier & Burgundy","iPhone 18 Pro Colours: Black, Silver, Glacier & Burgundy\nSEO Title: iPhone 18 Pro Colours: Black, Silver, Glacier & Burgundy | EVO18\nPrimary Keyword: iPhone 18 Pro colours\nURL: /blog/iphone-18-pro-colours\nMeta Description: Explore the iPhone 18 Pro colours available through EVO18: Black, Silver, Glacier and Burgundy.\nThe iPhone 18 Pro is presented in four finishes in the EVO18 catalogue: Black, Silver, Glacier and Burgundy. The finish changes the look of the phone, while model and storage determine the core configuration.\n\nBlack\nA dark, understated finish for customers who prefer a minimalist appearance.\n\nSilver\nA clean, lighter finish that gives the Pro design a bright and understated look.\n\nGlacier\nA cooler-toned option for customers who want something distinctive while keeping the overall appearance refined.\n\nBurgundy\nA deeper, more expressive finish that gives the iPhone a stronger visual presence.\n\nDoes colour affect the price?\nColour should not automatically change the EVO18 base price. The applicable price is determined by the selected model and storage configuration, subject to live availability and pricing.\n\nWhich iPhone 18 Pro colour should you choose?\nThe choice is personal. Consider whether you normally use a case, whether you prefer a subtle or more distinctive finish and which colour you expect to enjoy over the life of the phone.\n\nOn the EVO18 product page, selecting a colour updates the product presentation while keeping your selected model and storage visible. Explore the available finishes before choosing your configuration."],["Where to Buy an iPhone in Sri Lanka: A Practical Guide","Where to Buy an iPhone in Sri Lanka: A Practical Guide\nSEO Title: Where to Buy an iPhone in Sri Lanka | EVO18\nPrimary Keyword: where to buy iPhone in Sri Lanka\nURL: /blog/where-to-buy-iphone-sri-lanka\nMeta Description: Looking for where to buy an iPhone in Sri Lanka? Learn what to check when comparing retailers, prices, warranty and delivery before buying.\nIf you're deciding where to buy an iPhone in Sri Lanka, compare more than the headline price. Availability, warranty terms, delivery, returns, product condition and customer support can all affect the buying experience.\n\nWhat should you check?\nStart with the exact model and storage. Make sure the seller clearly states what device and configuration you are receiving.\n\nCheck whether the device is new, previously activated, refurbished or otherwise used. The product condition should be clear before payment.\n\nReview the warranty and support terms. Confirm who provides the warranty, what it covers and how a claim is handled.\n\nCheck the final price, including any delivery charges or other applicable costs.\n\nIf you are buying online, make sure the seller provides clear contact information, an invoice or proof of purchase and a defined return or exchange process.\n\nWhat about imported devices?\nIf a device is imported outside an authorised local retail channel, check the exact model or region, compatibility, warranty coverage, return terms and after-sales support before buying. A lower price should be understood in the context of the complete purchase.\n\nBuying through EVO18\nEVO18 is designed as an online-first iPhone buying experience for Sri Lanka. Customers can explore iPhone 18 Pro and iPhone 18 Pro Max, compare configurations, select storage and colour, review the applicable price and proceed through the demo checkout.\n\nFor the current EVO18 range, start with the product pages and compare the configuration you actually want before ordering."]];

function evo18SetBlogMeta(i){
  const a=EVO18_BLOG_SEO[i];
  if(!a) return;
  document.title=a.seoTitle;
  let meta=document.querySelector('meta[name="description"]');
  if(!meta){meta=document.createElement('meta');meta.name='description';document.head.appendChild(meta)}
  meta.content=a.meta;
  let canonical=document.querySelector('link[rel="canonical"]');
  if(!canonical){canonical=document.createElement('link');canonical.rel='canonical';document.head.appendChild(canonical)}
  canonical.href=location.origin+a.url;
}
function evo18BlogBody(i){
  const a=EVO18_BLOG_SEO[i];
  const esc=x=>x.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
  const sections=a.body.split(/\n\n+/).filter(Boolean);
  return sections.map((section,idx)=>{
    const lines=section.split(/\n+/).filter(Boolean);
    if(lines.length===1 && idx>0 && !/[.!?]$/.test(lines[0])) return '<h3>'+esc(lines[0])+'</h3>';
    if(lines.length>1 && lines.every(x=>/^\d+GB\s+—/.test(x))) return '<ul>'+lines.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
    if(lines.length>1 && lines.every(x=>/^(Display|Chip|Camera|Front camera|Storage|EVO18 demo price|Battery|Main camera|Rear cameras)\s+—/.test(x))) return '<ul>'+lines.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
    return lines.map(x=>'<p>'+esc(x)+'</p>').join('');
  }).join('');

Phone 18 Pro storage options from 256GB to 2TB and choose the capacity that fits your photos, video, apps and files.\nStorage is one of the biggest decisions when buying an iPhone because you cannot normally add internal storage later. The right capacity depends on what you keep on your phone, how often you record video and whether you rely on cloud storage.\nThe iPhone 18 Pro and iPhone 18 Pro Max are offered in four storage configurations in the EVO18 catalogue: 256GB, 512GB, 1TB and 2TB.\n256GB: A Practical Starting Point\n256GB is a sensible starting capacity for many everyday users.\nIt can accommodate a substantial collection of photographs, apps, messages, downloads and other files. Customers who regularly use cloud storage and stream content instead of storing everything locally may find this capacity practical.\nEVO18 demo price for iPhone 18 Pro: **LKR 499,900**.\n512GB: More Room for Photos and Video\n512GB doubles the capacity of the 256GB configuration.\nIt is useful for people who capture a lot of photographs and video, download media for offline use, install larger applications and prefer to keep more content on the device.\nEVO18 demo price for iPhone 18 Pro: **LKR 579,900**.\n1TB: For Large Local Libraries\n1TB provides substantially more room for large media libraries and demanding workflows.\nIt can make sense for creators, professionals and users who regularly handle large video files or want to keep extensive content locally.\nEVO18 demo price for iPhone 18 Pro: **LKR 699,900**.\n2TB: Maximum Capacity\n2TB is the highest storage configuration in the EVO18 catalogue.\nIt is most relevant to users with exceptionally large local libraries or professional workflows involving substantial amounts of media.\nEVO18 demo price for iPhone 18 Pro: **LKR 899,900**.\nWhat About iPhone 18 Pro Max?\nThe Pro Max follows the same storage range:\n256GB — LKR 529,900\n512GB — LKR 609,900\n1TB — LKR 729,900\n2TB — LKR 929,900\nThe best way to compare the prices is to select the model and storage together because the Pro Max has a different base price.\nDo You Need 1TB or 2TB?\nNot necessarily.\nIf your phone is mainly used for communication, photography, social media, streaming and ordinary apps, 256GB or 512GB may be sufficient.\nHigher capacities become more relevant when you regularly shoot and retain large amounts of high-resolution video, work with large files or prefer to keep most of your content locally.\nA Simple Way to Decide\nAsk yourself three questions:\n1. How much storage is your current phone using?\n2. How quickly are you filling it?\n3. Do you regularly delete or move large files?\nIf your current device is already close to full, moving to the next capacity can provide more useful headroom.\n\n5. iPhone 18 Pro Colours: Complete Guide to the Available Finishes\nSEO Title: iPhone 18 Pro Colours: Black, Silver, Glacier & Burgundy | EVO18\nPrimary Keyword: iPhone 18 Pro colours\nURL: /blog/iphone-18-pro-colours\nMeta Description: Explore the iPhone 18 Pro colours available through EVO18, including Black, Silver, Glacier and Burgundy.\nThe colour you choose is one of the most visible parts of your new iPhone. The iPhone 18 Pro generation is presented in four finishes: Black, Silver, Glacier and Burgundy.\nAll four give the Pro range a different visual character, while the underlying phone configuration remains the same apart from the selected model and storage.\nBlack\nBlack is the understated option for customers who prefer a darker, minimalist appearance.\nIt pairs easily with a wide range of cases and accessories and gives the phone a classic look.\nSilver\nSilver offers a clean, bright finish that highlights the phone's refined Pro design.\nIt is a versatile choice for customers who prefer a lighter appearance.\nGlacier\nGlacier provides a cooler, more distinctive finish while maintaining the understated character expected from a Pro device.\nIt can be a good choice for customers who want something different re to Buy an iPhone in Sri Lanka | EVO18\nPrimary Keyword: where to buy iPhone in Sri Lanka\nSecondary Keywords: best place to buy iPhone in Sri Lanka; iPhone shops in Sri Lanka; buy iPhone Sri Lanka; genuine iPhone Sri Lanka; iPhone dealers Sri Lanka; iPhone Colombo\nSuggested URL: /blog/where-to-buy-iphone-sri-lanka\nMeta Description: Looking for where to buy an iPhone in Sri Lanka? Learn what to check when comparing Apple retailers, specialists and online sellers before you buy.\nBuying an iPhone in Sri Lanka\nBuying a new iPhone is a significant purchase, and the seller you choose can matter just as much as the model you choose. Prices, availability, warranty arrangements, delivery options and after-sales support can vary between sellers.\n\nIf you're searching for where to buy an iPhone in Sri Lanka, it helps to compare the complete purchase rather than looking only at the headline price.\n\nThis guide explains the main types of sellers you may encounter and the questions worth asking before placing an order.\n1. Apple-Authorised Retailers\nApple-authorised retailers operate within Apple's authorised retail and service ecosystem, subject to the relevant requirements of the programme.\n\nFor customers, one reason to consider an authorised retailer is the clarity around the applicable manufacturer support and warranty arrangements. If this matters to you, confirm exactly what warranty applies to the specific device before purchasing.\n\nAuthorisation status should be verified directly rather than assumed because a retailer sells Apple products.\n2. Established Apple Specialists\nSome Sri Lankan retailers specialise heavily in Apple products. A specialist may offer several iPhone configurations and related products or services.\n\nWhen comparing a specialist retailer, look beyond the product price. Check whether the seller clearly states the device condition, exact model, storage, warranty terms, return policy and contact details.\n\nA specialist retailer can be particularly useful when you want advice on comparing models or configurations, but the specific services offered will vary from business to business.\n3. Online iPhone Retailers\nOnline retailers can make it easier to compare models, storage capacities and prices without visiting a physical shop.\n\nHowever, buying online means you should pay particular attention to the information presented before checkout. A trustworthy online buying experience should make it clear who the seller is, how to contact them, what product you are receiving, how delivery works and what happens if there is a problem with the order.\n\nBefore paying, review the seller's terms and make sure the final price and selected configuration are clearly displayed.\n4. Imported or Grey-Market Devices\nSri Lankan customers may also encounter imported devices sold outside an authorised local retail channel. These products can sometimes be offered at different prices or with different availability.\n\nThat does not by itself tell you whether a particular purchase is suitable. Instead, check the details that affect your ownership experience: the exact model and region, warranty coverage, compatibility, return terms, invoice, activation status and after-sales support.\n\nIf a price is significantly different from other listings, ask why before making the purchase.\nWhat Should You Check Before Buying an iPhone?\nWhether you are buying from a physical retailer or online, use a simple checklist before you pay:\nIs the device new, used, refurbished or otherwise previously activated?\nWhat is the exact iPhone model and storage capacity?\nWhich colour and configuration are you receiving?\nWhat warranty applies, and who provides it?\nWhat is the return and exchange policy?\nIs the advertised price the final price?\nAre delivery charges included?\nWill you receive a proper invoice or proof of purchase?\nHow can you contact the seller if something goes wrong?\nIf the device is imported, what regional or model-specific considerations should you know about?\nPrice Is Only One Part of the Purchase\nThe lowest advertised price is not necessarily the lowest-risk purchase. Compare the complete package: the device itself, warranty, return terms, delivery, payment arrangements, customer support and the seller's transparency.\nWhy Consider EVO18?\nEVO18 is designed around a focused iPhone buying experience in Sri Lanka. Customers can explore iPhone 18 Pro and iPhone 18 Pro Max, compare configurations, select storage and colour, review the applicable price and contact the EVO18 team before ordering.\nThe goal is to make the process easier to understand: know the model, know the configuration, know the price and know the terms before you buy.\n | Compare Models | Contact EVO18\nInternal Links for This Article\niPhone 18 Pro product page\niPhone 18 Pro Max product page\nCompare Models page\nWarranty page\nDelivery page\nFAQ page\nContact EVO18\nPublishing note: This article should be reviewed whenever EVO18's seller information, warranty arrangements, delivery terms or product catalogue changes. Do not describe EVO18 as Apple-authorised unless that status is independently verified."}];

<script id="evo18-smooth-price">
(function(){
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const selectors = [
    '.price', '.product-price', '.config-price',
    '[class*="price"]', '[id*="price"]'
  ];

  let locked = false;
  const observer = new MutationObserver(function(mutations){
    if (locked) return;
    const changed = new Set();

    mutations.forEach(function(m){
      let el = m.target.nodeType === 1 ? m.target : m.target.parentElement;
      if (!el) return;
      let price = el.closest ? el.closest(selectors.join(',')) : null;
      if (!price && el.matches && selectors.some(s => { try{return el.matches(s)}catch(e){return false} })) price = el;
      if (price) changed.add(price);
    });

    if (!changed.size) return;
    locked = true;

    changed.forEach(function(price){
      price.animate([
        { opacity: 1, transform: 'translateY(0)' },
        { opacity: .72, transform: 'translateY(-2px)' },
        { opacity: 1, transform: 'translateY(0)' }
      ], {
        duration: 360,
        easing: 'cubic-bezier(.22,1,.36,1)'
      });
    });

    setTimeout(function(){ locked=false; }, 380);
  });

  observer.observe(document.body, {
    subtree:true,
    childList:true,
    characterData:true
  });
})();
</script>



<script id="evo18-inverted-cursor-js">
(function(){
  if (!window.matchMedia ||
      !window.matchMedia('(pointer:fine)').matches ||
      window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const dot=document.createElement('div');
  dot.id='evo18-cursor-dot';
  document.body.appendChild(dot);

  let x=-100,y=-100,tx=-100,ty=-100;

  function frame(){
    x += (tx - x) * 0.42;
    y += (ty - y) * 0.42;
    dot.style.transform='translate3d('+x+'px,'+y+'px,0)';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  document.addEventListener('pointermove',function(e){
    tx=e.clientX; ty=e.clientY;

    const interactive=e.target.closest(
      'a,button,[role="button"],input,select,summary,.btn,.button,'+
      '.color-swatch,.swatch,.storage-option,.model-option'
    );
    const product=e.target.closest(
      '.product-card,.accessory-card,.accessories-card,[data-product]'
    );

    dot.classList.toggle('is-hover',!!interactive && !product);
    dot.classList.toggle('is-product',!!product);
  },{passive:true});

  document.addEventListener('mouseleave',()=>dot.style.opacity='0');
  document.addEventListener('mouseenter',()=>dot.style.opacity='1');
})();
</script>

<script id="evo18-scan-game-js">
(function(){
function initScan(){
  const trigger=document.getElementById('evo18-scan-trigger');
  const overlay=document.getElementById('evo18-scan-overlay');
  const complete=document.getElementById('evo18-scan-complete');
  if(!trigger||!overlay||!complete)return;

  const hud=overlay.querySelector('#evo18-scan-hud');
  const cursor=overlay.querySelector('#evo18-scan-cursor');
  let active=false,found=0,startedAt=0,raf=0,toastTimer=null;
  let best=Number(localStorage.getItem('evo18ScanBest')||0);

  function resetHud(){
    hud.innerHTML='EVO18 SCAN · <span class="evo18-count">0 / 5</span><span class="evo18-timer">00.00</span>';
    return {
      count:hud.querySelector('.evo18-count'),
      timer:hud.querySelector('.evo18-timer')
    };
  }
  let ui=resetHud();

  function tick(){
    if(!active)return;
    ui.timer.textContent=((performance.now()-startedAt)/1000).toFixed(2);
    raf=requestAnimationFrame(tick);
  }

  function move(e){
    if(!active)return;
    cursor.style.left=e.clientX+'px';
    cursor.style.top=e.clientY+'px';
    overlay.querySelectorAll('.evo18-scan-target:not(.found)').forEach(function(t){
      const r=t.getBoundingClientRect();
      const d=Math.hypot(
        e.clientX-(r.left+r.width/2),
        e.clientY-(r.top+r.height/2)
      );
      t.classList.toggle('near',d<120);
    });
  }

  function buildTargets(){
    overlay.querySelectorAll('.evo18-scan-target').forEach(function(t){t.remove();});
    const spots=[];
    let tries=0;
    while(spots.length<5 && tries++<1000){
      const x=10+Math.random()*80;
      const y=16+Math.random()*72;
      if(spots.every(function(p){return Math.hypot(x-p[0],y-p[1])>15;})){
        spots.push([x,y]);
      }
    }
    spots.forEach(function(p,i){
      const t=document.createElement('button');
      t.type='button';
      t.className='evo18-scan-target';
      t.style.left=p[0]+'%';
      t.style.top=p[1]+'%';
      t.setAttribute('aria-label','Scan marker '+(i+1));
      t.addEventListener('click',function(e){
        e.preventDefault();
        e.stopPropagation();
        if(!active || t.classList.contains('found'))return;
        t.classList.add('found');
        found++;
        ui.count.textContent=found+' / 5';
        if(found===5)finish();
      });
      overlay.appendChild(t);
    });
  }

  function hideToast(){
    if(toastTimer){
      clearTimeout(toastTimer);
      toastTimer=null;
    }
    complete.classList.add('closing');
    complete.classList.remove('show');
    setTimeout(function(){
      complete.style.visibility='hidden';
      complete.classList.remove('closing');
    },220);
  }

  function stopScan(){
    active=false;
    overlay.classList.remove('active');
    trigger.classList.remove('is-active');
    document.body.style.cursor='';
    cursor.style.opacity='0';
    window.removeEventListener('pointermove',move);
    if(raf){
      cancelAnimationFrame(raf);
      raf=0;
    }
  }

  function startScan(){
    hideToast();
    found=0;
    ui=resetHud();
    buildTargets();
    active=true;
    startedAt=performance.now();
    trigger.classList.add('is-active');
    overlay.classList.add('active');
    cursor.style.opacity='1';
    document.body.style.cursor='none';
    window.addEventListener('pointermove',move,{passive:true});
    raf=requestAnimationFrame(tick);
  }

  function finish(){
    const elapsed=(performance.now()-startedAt)/1000;
    stopScan();

    const timeEl=complete.querySelector('.evo18-result-time');
    const recordEl=complete.querySelector('.evo18-record');
    timeEl.textContent=elapsed.toFixed(2)+'s';
    recordEl.classList.remove('record-new');

    if(!best || elapsed<best){
      best=elapsed;
      localStorage.setItem('evo18ScanBest',String(best));
      recordEl.textContent='NEW RECORD';
      recordEl.classList.add('record-new');
    }else{
      recordEl.textContent='BEST · '+best.toFixed(2)+'s';
    }

    complete.style.visibility='visible';
    complete.classList.remove('closing');
    void complete.offsetWidth;
    complete.classList.add('show');

    if(toastTimer)clearTimeout(toastTimer);
    toastTimer=setTimeout(hideToast,6000);
  }

  trigger.addEventListener('click',function(e){
    e.preventDefault();
    e.stopPropagation();
    if(active){
      stopScan();
    }else{
      startScan();
    }
  });

  const closeBtn=complete.querySelector('.evo18-toast-close');
  const retryBtn=complete.querySelector('.evo18-toast-retry');

  if(closeBtn){
    closeBtn.addEventListener('click',function(e){
      e.preventDefault();
      e.stopPropagation();
      hideToast();
    });
  }

  if(retryBtn){
    retryBtn.addEventListener('click',function(e){
      e.preventDefault();
      e.stopPropagation();
      hideToast();
      setTimeout(startScan,220);
    });
  }
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',initScan,{once:true});
}else{
  initScan();
}
})();
</script>

<script id="evo18-search-js">
(function(){
  const items=[
    ['iPhone 18 Pro','#/iphone-18-pro','Explore iPhone 18 Pro'],
    ['iPhone 18 Pro Max','#/iphone-18-pro-max','Explore iPhone 18 Pro Max'],
    ['Accessories','#/accessories','Cases, chargers and accessories'],
    ['Compare','#/compare','Compare iPhone 18 Pro models'],
    ['Trade-In','#/trade-in','Trade in your current phone'],
    ['About EVO18','#/about','Learn about EVO18'],
    ['Blog','#/blog','Guides and articles'],
    ['FAQ','#/faq','Frequently asked questions'],
    ['Track Order','#/track-order','Track an existing order'],
    ['Contact','#/contact','Get in touch with EVO18'],
    ['Shop','#/shop','Shop iPhone 18 Pro']
  ];

  function panel(){return document.getElementById('evo18-search-panel')}
  function input(){return document.getElementById('evo18-search-input')}
  function closeSearch(){
    const p=panel();
    if(!p)return;
    p.classList.remove('open');
    p.setAttribute('aria-hidden','true');
  }
  function renderResults(q){
    const box=document.getElementById('evo18-search-results');
    if(!box)return;
    const query=(q||'').trim().toLowerCase();
    const matches=query ? items.filter(x=>(x[0]+' '+x[2]).toLowerCase().includes(query)) : items.slice(0,6);
    if(!matches.length){
      box.innerHTML='<div class="evo18-search-empty">No results found</div>';
      return;
    }
    box.innerHTML=matches.map(x=>
      '<a class="evo18-search-result" href="'+x[1]+'"><span>'+x[0]+'</span><small>'+x[2]+'</small><b>→</b></a>'
    ).join('');
    box.querySelectorAll('.evo18-search-result').forEach(a=>{
      a.addEventListener('click',function(){closeSearch();});
    });
  }

  window.toggleEvoSearch=function(){
    const p=panel(), i=input();
    if(!p||!i)return;
    const open=p.classList.toggle('open');
    p.setAttribute('aria-hidden',open?'false':'true');
    if(open){
      i.value='';
      renderResults('');
      requestAnimationFrame(()=>i.focus());
    }
  };

  document.addEventListener('DOMContentLoaded',function(){
    const i=input(), c=document.getElementById('evo18-search-close');
    if(i)i.addEventListener('input',()=>renderResults(i.value));
    if(i)i.addEventListener('keydown',function(e){
      if(e.key==='Escape')closeSearch();
      if(e.key==='Enter'){
        const first=document.querySelector('.evo18-search-result');
        if(first)first.click();
      }
    });
    if(c)c.addEventListener('click',closeSearch);
  });

  document.addEventListener('keydown',function(e){
    if(e.key==='/' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){
      e.preventDefault();
      const p=panel();
      if(p && !p.classList.contains('open'))window.toggleEvoSearch();
    }
    if(e.key==='Escape')closeSearch();
  });

  // Close the search overlay whenever navigation changes. This prevents
  // search results from remaining visible after Home or another route is selected.
  window.addEventListener('hashchange', closeSearch);
})();
</script>






<script id="evo18-smooth-cursor">
(() => {
 const c=document.querySelector('.custom-cursor, .cursor, #cursor');
 if(!c || matchMedia('(pointer:coarse)').matches) return;
 let tx=innerWidth/2,ty=innerHeight/2,x=tx,y=ty,last=0,raf=0;
 const move=e=>{tx=e.clientX;ty=e.clientY;if(!raf)raf=requestAnimationFrame(frame)};
 function frame(t){raf=0;const dt=Math.min(32,last?t-last:16.67);last=t;
   const a=1-Math.exp(-dt/90);x+=(tx-x)*a;y+=(ty-y)*a;
   c.style.transform=`translate3d(${x}px,${y}px,0) translate(-50%,-50%)`;
   if(Math.abs(tx-x)>.03||Math.abs(ty-y)>.03)raf=requestAnimationFrame(frame)}
 addEventListener('pointermove',move,{passive:true});
 requestAnimationFrame(frame);
})();
</script>

<script id="evo18-mobile-menu-script">
(function(){
  function ensureDrawer(){
    var drawer=document.querySelector('.evo18-mobile-drawer');
    if(!drawer){
      drawer=document.createElement('div'); drawer.className='evo18-mobile-drawer'; drawer.setAttribute('aria-hidden','true');
      var seen={};
      document.querySelectorAll('.header nav.links a').forEach(function(a){
        if(a.href && !seen[a.href]){seen[a.href]=1;var x=a.cloneNode(true);x.className='';drawer.appendChild(x);}
      });
      var themeRow=document.createElement('div');
      themeRow.className='evo18-mobile-theme-row';
      themeRow.innerHTML='<span class="evo18-mobile-theme-label">Appearance</span><button id="evo18MobileThemeToggle" type="button" aria-label="Toggle appearance"><span class="evo18-theme-icon" aria-hidden="true">☾</span></button>';
      drawer.appendChild(themeRow);
      document.body.appendChild(drawer);
    }
    return drawer;
  }
  var lockedScrollY=0;
  function lockPageScroll(){
    lockedScrollY=window.scrollY||window.pageYOffset||0;
    document.documentElement.classList.add('evo18-menu-lock');
    document.body.classList.add('evo18-menu-lock','evo18-menu-fixed');
    document.body.style.top=(-lockedScrollY)+'px';
  }
  function unlockPageScroll(){
    document.documentElement.classList.remove('evo18-menu-lock');
    document.body.classList.remove('evo18-menu-lock','evo18-menu-fixed');
    document.body.style.top='';
    window.scrollTo(0,lockedScrollY);
  }
  function closeMenu(){var b=document.getElementById('evo18-mobile-menu-toggle'),d=document.querySelector('.evo18-mobile-drawer');if(!b||!d)return;b.classList.remove('is-open');b.setAttribute('aria-expanded','false');b.setAttribute('aria-label','Open menu');d.classList.remove('is-open');d.setAttribute('aria-hidden','true');document.body.classList.remove('evo18-menu-open');unlockPageScroll();}
  function openMenu(){var b=document.getElementById('evo18-mobile-menu-toggle'),d=ensureDrawer();if(!b||!d)return;b.classList.add('is-open');b.setAttribute('aria-expanded','true');b.setAttribute('aria-label','Close menu');d.classList.add('is-open');d.setAttribute('aria-hidden','false');document.body.classList.add('evo18-menu-open');lockPageScroll();}
  document.addEventListener('click',function(e){var b=e.target.closest('#evo18-mobile-menu-toggle');if(b){e.preventDefault();var d=document.querySelector('.evo18-mobile-drawer');d&&d.classList.contains('is-open')?closeMenu():openMenu();return;}if(e.target.closest('.evo18-mobile-drawer a'))closeMenu();});
  document.addEventListener('touchmove',function(e){
    if(window.innerWidth<=768 && document.body.classList.contains('evo18-menu-open') && !e.target.closest('.evo18-mobile-drawer')) e.preventDefault();
  },{passive:false});
  window.addEventListener('resize',function(){if(window.innerWidth>768)closeMenu();});
})();
</script>

<script id="evo18-mobile-scroll-menu">
(function(){
  function init(){
    var b=document.getElementById('evo18-mobile-menu-toggle');
    if(!b)return;
    var timer;
    window.addEventListener('scroll',function(){
      if(window.innerWidth>768 || b.classList.contains('is-open'))return;
      b.classList.add('scroll-dim');
      clearTimeout(timer);
      timer=setTimeout(function(){b.classList.remove('scroll-dim')},220);
    },{passive:true});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>





<script id="evo18-mobile-hero-colour-direct-fix">
(function(){
  function init(){
    document.querySelectorAll('.hero-colours').forEach(function(group){
      if(group.dataset.evoDirectBound==='1') return;
      group.dataset.evoDirectBound='1';

      function changeColour(e){
        var btn=e.target && e.target.closest ? e.target.closest('.hero-colour') : null;
        if(!btn || !group.contains(btn)) return;

        if(e.type==='touchstart') e.preventDefault();
        e.stopPropagation();

        var colour=btn.getAttribute('data-colour');
        if(!colour) return;

        var activeModel=document.querySelector('.hero-model-switch button.active');
        var model=(activeModel && /max/i.test(activeModel.textContent)) ? 'max' : 'pro';
        var img=document.getElementById('heroProductImage');
        if(!img) return;

        var file='./assets/phones/'+model+'-'+colour.toLowerCase()+'.webp';

        document.querySelectorAll('.hero-colour').forEach(function(x){
          x.classList.toggle('active',x===btn);
        });

        img.classList.add('is-changing');

        var pre=new Image();
        pre.onload=function(){
          img.src=file;
          img.alt='iPhone 18 '+(model==='max'?'Pro Max':'Pro')+' '+colour;
          var name=document.getElementById('heroProductName');
          var label=document.getElementById('heroProductColour');
          if(name) name.textContent='iPhone 18 '+(model==='max'?'Pro Max':'Pro');
          if(label) label.textContent=colour;
          requestAnimationFrame(function(){img.classList.remove('is-changing')});
        };
        pre.onerror=function(){
          /* Fallback: still switch the actual image element if a browser
             rejects the preload request. */
          img.src=file;
          img.classList.remove('is-changing');
        };
        pre.src=file;

        window.heroModel=model;
        window.heroColour=colour;
      }

      group.addEventListener('touchstart',changeColour,{passive:false,capture:true});
      group.addEventListener('pointerdown',changeColour,{passive:true,capture:true});
      group.addEventListener('click',changeColour,{passive:true,capture:true});
    });
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>

<script id="evo18-empty-cart-ux-handler">
(function(){
  function modal(){return document.getElementById('evo18-empty-modal')}
  function close(){
    var m=modal(); if(!m)return;
    m.classList.remove('open');m.setAttribute('aria-hidden','true');
  }
  function open(){
    var m=modal(); if(!m)return;
    m.classList.add('open');m.setAttribute('aria-hidden','false');
  }
  document.addEventListener('click',function(e){
    var empty=e.target.closest && e.target.closest('#emptyCartBtn');
    if(empty){
      e.preventDefault();e.stopPropagation();
      if(Array.isArray(cart)&&cart.length) open();
      return;
    }
    if(e.target.closest && e.target.closest('#evo18-empty-keep')){
      e.preventDefault();close();return;
    }
    if(e.target.closest && e.target.closest('#evo18-empty-confirm')){
      e.preventDefault();
      if(Array.isArray(cart)){cart.length=0;if(typeof save==='function')save();}
      close();
      if(typeof render==='function')render();
      return;
    }
    var m=modal();
    if(m && e.target===m){close();}
  },true);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
})();
</script>



<script id="evo18-mobile-theme-toggle-js">
(function(){
  function findExistingThemeButton(){
    var selectors=[
      '#themeToggle','#theme-toggle','#darkModeToggle','#dark-mode-toggle',
      '[data-theme-toggle]','.theme-toggle','.dark-toggle','.theme-switch'
    ];
    for(var i=0;i<selectors.length;i++){
      var el=document.querySelector(selectors[i]);
      if(el) return el;
    }
    return null;
  }

  function fallbackToggle(){
    var root=document.documentElement;
    var dark=!root.classList.contains('dark') &&
             root.getAttribute('data-theme')!=='dark';
    root.classList.toggle('dark',dark);
    root.setAttribute('data-theme',dark?'dark':'light');
    try{localStorage.setItem('theme',dark?'dark':'light')}catch(e){}
  }

  function syncIcon(){
    var root=document.documentElement;
    var dark=root.classList.contains('dark') || root.getAttribute('data-theme')==='dark';
    document.querySelectorAll('.evo18-theme-icon').forEach(function(x){
      x.textContent=dark?'☀':'☾';
    });
  }

  document.addEventListener('click',function(e){
    var b=e.target.closest && e.target.closest('#evo18MobileThemeToggle');
    if(!b) return;
    e.preventDefault();
    e.stopPropagation();
    var existing=findExistingThemeButton();
    if(existing && existing!==b){
      existing.click();
    }else{
      fallbackToggle();
    }
    setTimeout(syncIcon,0);
  },true);

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',syncIcon);
  }else{
    syncIcon();
  }
})();
</script>

<script id="evo18-accessories-revamp-js">
(function(){
  const A='assets/accessories/';
  const accessories=[
    {id:'cases',name:'Case',category:'Cases',desc:'A refined protective case collection designed to complement the iPhone 18 Pro.',variants:[
      {id:'black',label:'Black',price:21500,image:'case-black.webp',swatch:'#242424'},

    {id:'cables',name:'USB-C Charge Cable',category:'Cables',desc:'Choose the cable length and power rating that fits your setup.',variants:[
      {id:'1m',label:'1m',detail:'60W',price:7500,image:'cable-60w-1m.webp'},
      {id:'2m',label:'2m',detail:'240W',price:12500,image:'cable-240w-2m.webp'}
    ]},
    {id:'magsafe-charger',name:'MagSafe Charger',category:'MagSafe',price:14900,image:'magsafe-charger.png',desc:'Magnetic wireless charging designed around the iPhone experience.'},
    {id:'magsafe-battery',name:'MagSafe Battery',category:'Power Banks',price:29900,image:'magsafe-battery.webp',desc:'Extra magnetic power when you need to stay mobile.',bundleOptions:[
      {id:'battery-only',label:'Battery Only',price:29900,image:'magsafe-battery.webp'}
    ]},
    {id:'airpods-max-2',name:'AirPods Max 2',category:'Audio',desc:'Immersive over-ear audio with a choice of refined finishes.',variants:[
      {id:'midnight',label:'Midnight',price:115000,image:'airpods-max-2-midnight.webp',swatch:'#25272a'},
      {id:'blue',label:'Blue',price:115000,image:'airpods-max-2-blue.webp',swatch:'#4d78a5'},
      {id:'blue-starlight',label:'Blue Starlight',price:115000,image:'airpods-max-2-blue-starlight.webp',swatch:'#d8d0bf'},
      {id:'orange',label:'Orange',price:115000,image:'airpods-max-2-orange.webp',swatch:'#e46d2f'},
      {id:'purple',label:'Purple',price:115000,image:'airpods-max-2-purple.webp',swatch:'#8c77b8'}
    ]},
    {id:'car-magsafe-vent-mount',name:'Magnetic Wireless Charging Car Vent Mount',category:'Car Accessories',price:16900,image:'car-magsafe-vent-mount.webp',desc:'Keep your iPhone visible, secure and charging while you drive.'}
  ];
  const categories=['All','Cases','Screen Protectors','Chargers','Cables','MagSafe','Power Banks','Audio','Car Accessories'];
  const state={};
  accessories.forEach(p=>{state[p.id]=p.variants?p.variants[0].id:null});
  const caseModelState={cases:'18-pro'};
  let currentFilter='All';
  let selectedId=null;
  window.EVO18AccessoryProducts=accessories;

  function money(n){return 'LKR '+Number(n||0).toLocaleString('en-LK')}
  function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function q(v){return "'"+String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'"}
  function variant(p){return p.variants?p.variants.find(v=>v.id===state[p.id])||p.variants[0]:p}
  function imagePath(p){return A+(variant(p).image)}
  function featureImagePath(p){
    if(p.id==='magsafe-charger') return A+'magsafe-charger.png';
    if(p.id==='car-magsafe-vent-mount') return A+'car-magsafe-vent-mount.webp';
    return imagePath(p);
  }
  function productPrice(p){
    return variant(p).price||p.price;
  }
  function productLabel(p){
    const v=variant(p);
    if(p.id==='cases') return p.name+' — '+(caseModelState.cases==='18-pro-max'?'iPhone 18 Pro Max':'iPhone 18 Pro')+' — '+v.label+(v.note?' · '+v.note:'');
    return p.variants ? p.name+' — '+v.label : p.name;
  }
  function animateImageSwap(img, src, alt){
    if(!img || !src || img.src===src) return;
    /* Match the iPhone 18 Pro colour-switch animation exactly:
       a short, subtle opacity + scale/translate transition with no blur. */
    img.classList.add('accessory-image-changing');
    img.src=src;
    img.alt=alt||'';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        img.classList.remove('accessory-image-changing');
      });
    });
  }

  function featureTitleHTML(p){
    const v=variant(p);
    if(p.id==='airpods-max-2'){
      return esc(p.name)+'<span class="feature-variant-line">'+esc(v.label)+'</span>';
    }
    if(p.id==='cases'){
      return esc(p.name)+'<span class="feature-variant-line">'+esc(caseModelState.cases==='18-pro-max'?'iPhone 18 Pro Max':'iPhone 18 Pro')+' · '+esc(v.label)+(v.note?' · '+esc(v.note):'')+'</span>';
    }
    if(p.variants){
      return esc(p.name)+'<span class="feature-variant-line">'+esc(v.label)+'</span>';
    }
    return esc(p.name);
  }
  function syncFeature(p, animate){
    const v=variant(p);
    const img=document.getElementById('accessoryFeatureImg');
    if(img){
      img.setAttribute('data-feature-id',p.id);
      img.alt=productLabel(p);
      if(animate) animateImageSwap(img,featureImagePath(p),productLabel(p));
      else { img.src=featureImagePath(p); img.classList.remove('accessory-image-changing','accessory-image-entering'); }
    }
    const title=document.getElementById('accessoryFeatureTitle'); if(title) title.innerHTML=featureTitleHTML(p);
    const text=document.getElementById('accessoryFeatureText'); if(text) text.textContent=p.desc;
    const price=document.getElementById('accessoryFeaturePrice'); if(price) price.textContent=money(productPrice(p));
    const category=document.getElementById('accessoryFeatureCategory'); if(category) category.textContent=p.category;
    const opts=document.getElementById('accessoryFeatureOptions'); if(opts) opts.innerHTML=options(p,true);
    const button=document.getElementById('accessoryFeatureAdd'); if(button) button.setAttribute('onclick',"accessoryAdd('"+p.id+"')");
  }
  function setState(id,v){
    const p=accessories.find(x=>x.id===id); if(!p)return;
    const next=p.variants ? p.variants.find(x=>x.id===v) : null;
    if(p.variants && !next)return;
    state[id]=v;

    /* Update only the affected UI instead of rebuilding the entire page.
       This keeps the page position, hover state and scroll position intact. */
    document.querySelectorAll('[data-accessory-id="'+id+'"]').forEach(function(card){
      const img=card.querySelector('.accessory-product-image img');
      const label=card.querySelector('.accessory-variant-label strong');
      const price=card.querySelector('.accessory-product-bottom strong');
      const choices=card.querySelectorAll('.accessory-swatch, .accessory-choice');
      const src=imagePath(p);
      if(img){ animateImageSwap(img,src,productLabel(p)); }
      if(label) label.textContent=next ? (next.label+(next.note?' · '+next.note:'')) : '';
      if(price) price.textContent=money(productPrice(p));
      choices.forEach(function(btn){
        const onclick=btn.getAttribute('onclick')||'';
        btn.classList.toggle('active',onclick.indexOf("'"+v+"'")!==-1 || onclick.indexOf('"'+v+'"')!==-1);
      });
    });

    /* Keep the featured panel synced to the variant the customer just chose.
       This also fixes variant changes made directly on a product card: the
       bottom panel now follows the selected product/finish without a rerender. */
    selectedId=id;
    syncFeature(p,true);
  }

  function caseModelOptions(feature=false){
    const max=caseModelState.cases==='18-pro-max';
    return '<div class="accessory-variant-area accessory-case-model-area '+(feature?'accessory-feature-options':'')+'"><div class="accessory-variant-label"><span>Model</span><strong>'+(max?'iPhone 18 Pro Max':'iPhone 18 Pro')+'</strong></div><div class="accessory-choice-row accessory-model-choice-row '+(feature?'accessory-feature-choices':'')+'"><button type="button" class="accessory-choice '+(!max?'active':'')+'" onclick="event.stopPropagation();accessoryCaseModel(\'18-pro\')">iPhone 18 Pro</button><button type="button" class="accessory-choice '+(max?'active':'')+'" onclick="event.stopPropagation();accessoryCaseModel(\'18-pro-max\')">iPhone 18 Pro Max</button></div></div>';
  }
  function options(p,feature=false){
    if(!p.variants)return '';
    const v=variant(p);
    if(p.id==='cables'){
      return '<div class="accessory-variant-area '+(feature?'accessory-feature-options':'')+'"><div class="accessory-variant-label"><span>Length</span><strong>'+esc(v.label)+' · '+esc(v.detail)+'</strong></div><div class="accessory-choice-row '+(feature?'accessory-feature-choices':'')+'">'+p.variants.map(x=>'<button type="button" class="accessory-choice '+(x.id===v.id?'active':'')+'" onclick="event.stopPropagation();accessoryVariant('+q(p.id)+','+q(x.id)+')">'+esc(x.label)+' <small>'+esc(x.detail)+'</small></button>').join('')+'</div></div>';
    }
    return (p.id==='cases'?caseModelOptions(feature):'')+'<div class="accessory-variant-area '+(feature?'accessory-feature-options':'')+'"><div class="accessory-variant-label"><span>Finish</span><strong>'+esc(v.label)+(v.note?' · '+esc(v.note):'')+'</strong></div><div class="accessory-swatches '+(feature?'accessory-feature-swatches':'')+'">'+p.variants.map(x=>'<button type="button" aria-label="'+esc(x.label)+(x.note?' — '+esc(x.note):'')+'" title="'+esc(x.label)+(x.note?' — '+esc(x.note):'')+'" class="accessory-swatch '+(x.id===v.id?'active':'')+(x.clear?' clear':'')+'" style="background:'+x.swatch+'" onclick="event.stopPropagation();accessoryVariant('+q(p.id)+','+q(x.id)+')"></button>').join('')+'</div></div>';
  }
  window.accessoryCaseModel=function(model){
    if(model!=='18-pro' && model!=='18-pro-max') return;
    caseModelState.cases=model;
    const p=accessories.find(x=>x.id==='cases'); if(!p)return;
    selectedId='cases';
    document.querySelectorAll('[data-accessory-id="cases"]').forEach(function(card){
      const area=card.querySelector('.accessory-case-model-area');
      if(area){
        const strong=area.querySelector('.accessory-variant-label strong');
        if(strong) strong.textContent=model==='18-pro-max'?'iPhone 18 Pro Max':'iPhone 18 Pro';
        area.querySelectorAll('.accessory-model-choice-row .accessory-choice').forEach(function(btn){
          btn.classList.toggle('active',btn.textContent.trim()===(model==='18-pro-max'?'iPhone 18 Pro Max':'iPhone 18 Pro'));
        });
      }
      const img=card.querySelector('.accessory-product-image img');
      if(img){
        img.alt=productLabel(p);
      }
    });
    syncFeature(p,true);
  };
  window.accessoryVariant=function(id,v){setState(id,v)};
  window.accessoryAdd=function(id){
    const p=accessories.find(x=>x.id===id); if(!p)return;
    const v=variant(p); const key='accessory|'+p.id+'|'+v.id; const name=productLabel(p);
    const found=cart.find(i=>i.key===key);
    if(found) found.qty=Number(found.qty||0)+1;
    else cart.push({key,type:'accessory',name,category:p.category,price:v.price||p.price,qty:1,image:imagePath(p)});
    save(); toast(name+' added to cart'); render();
  };
  window.accessorySelect=function(id){
    const p=accessories.find(x=>x.id===id); if(!p)return;
    selectedId=id;
    syncFeature(p,false);
    const feature=document.querySelector('.accessory-feature'); if(feature)feature.scrollIntoView({behavior:'smooth',block:'center'});
  };
  window.accessoryFilter=function(filter){mount(accessoriesPage(filter));};

  window.accessoriesPage=function(filter){
    filter=filter||currentFilter||'All';
    currentFilter=filter;
    const shown=filter==='All'?accessories:accessories.filter(x=>x.category===filter);
    const first=shown.find(x=>x.id===selectedId)||shown[0]||accessories[0];
    const counts={}; accessories.forEach(x=>counts[x.category]=(counts[x.category]||0)+1);
    const pills=categories.map(x=>'<button class="accessory-tab '+(x===filter?'active':'')+'" type="button" onclick="accessoryFilter('+q(x)+')"><span>'+esc(x)+'</span>'+(x!=='All'?'<small>'+counts[x]+'</small>':'<small>'+accessories.length+'</small>')+'</button>').join('');
    const cards=shown.map(p=>{
      const v=variant(p);
      return '<article class="accessory-product-card" data-accessory-id="'+esc(p.id)+'" tabindex="0" onclick="accessorySelect('+q(p.id)+')" onkeydown="if(event.key===\'Enter\' || event.key===\' \'){event.preventDefault();accessorySelect('+q(p.id)+')}"><div class="accessory-product-image"><img src="'+imagePath(p)+'" alt="'+esc(productLabel(p))+'" loading="lazy" decoding="async"></div><div class="accessory-product-copy"><h3>'+esc(p.name)+'</h3>'+options(p)+'<div class="accessory-product-bottom"><strong>'+money(productPrice(p))+'</strong><button class="btn primary accessory-add" type="button" onclick="event.stopPropagation();accessoryAdd('+q(p.id)+')">Add to Cart</button></div></div></article>';
    }).join('');
    return '<main class="accessories-revamped"><section class="accessory-hero-new"><div class="wrap"><div class="accessory-hero-grid"><div><div class="eyebrow">EVO18 ACCESSORIES</div><h1>Complete the setup.</h1><p>Cases, charging, power, audio and everyday essentials — selected to sit naturally alongside your iPhone.</p><div class="accessory-hero-actions"><a class="btn primary" href="#/models">Shop iPhone 18 Pro</a><a class="btn secondary" href="#/cart">View Cart</a></div></div><div class="accessory-hero-stack"><div class="stack-card stack-card-main"><img src="'+imagePath(first)+'" alt="'+esc(productLabel(first))+'"></div><div class="stack-card stack-card-small"><img src="'+A+'airpods-max-2-midnight.webp" alt="AirPods Max 2 — Midnight"></div><div class="stack-label"><span>8 products</span><small>7 finish options on cases</small></div></div></div></div></section><section class="section accessory-catalog"><div class="wrap"><div class="accessory-section-head"><div><div class="eyebrow">SHOP ACCESSORIES</div><h2>Build your setup.</h2></div><p>Explore a curated range. Choose a finish or cable length directly on the product card — just like configuring your iPhone.</p></div><div class="accessory-tabs-new">'+pills+'</div><div class="accessory-product-grid">'+cards+'</div><div class="accessory-feature"><div class="feature-image"><img id="accessoryFeatureImg" data-feature-id="'+esc(first.id)+'" src="'+featureImagePath(first)+'" alt="'+esc(productLabel(first))+'" loading="lazy" decoding="async"></div><div class="feature-copy"><div class="eyebrow" id="accessoryFeatureCategory">'+esc(first.category)+'</div><h2 id="accessoryFeatureTitle">'+featureTitleHTML(first)+'</h2><p id="accessoryFeatureText">'+esc(first.desc)+'</p><div id="accessoryFeatureOptions">'+options(first,true)+'</div><div class="accessory-feature-price" id="accessoryFeaturePrice">'+money(productPrice(first))+'</div><button class="btn primary" id="accessoryFeatureAdd" type="button" onclick="accessoryAdd('+q(first.id)+')">Add to Cart</button><a class="feature-cart-link" href="#/cart">Go to Cart →</a></div></div></div></section></main>';
  };
})();
</script>

<script id="evo18-mobile-bottom-nav-scroll-top">
(function(){
  if(window.__evo18BottomNavScrollBound) return;
  window.__evo18BottomNavScrollBound=true;

  function normalize(path){
    path=(path||'/').split('?')[0]||'/';
    if(path==='/shop'||path==='/iphone-18-pro'||path==='/iphone-18-pro-max') return '/models';
    if(path==='/orders'||path==='/order'||path==='/track-order') return '/track-order';
    return path;
  }

  document.addEventListener('click',function(e){
    if(window.innerWidth>768) return;
    var link=e.target.closest('.evo18-mobile-bottom-nav a');
    if(!link) return;

    var target=normalize((link.getAttribute('href')||'').replace(/^#/,''));
    var current=normalize((location.hash||'#/').replace(/^#/,''));

    if(target===current){
      e.preventDefault();
      e.stopPropagation();
      window.scrollTo({top:0,left:0,behavior:'smooth'});
    }
  },true);
})();
</script>


<script id="evo18-accessories-reload-fix">
(function(){
  function refreshAccessoriesSafely(){
    var path=(location.hash||'#/').replace(/^#/,'').split('?')[0]||'/';
    if(path==='/accessories' && typeof window.render==='function'){
      try { window.render(); } catch(e) { console.warn('EVO18 accessories reload:',e); }
    }
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',function(){ setTimeout(refreshAccessoriesSafely,80); },{once:true});
  }else{
    setTimeout(refreshAccessoriesSafely,80);
  }
})();
</script>


<script id="evo18-final-reload-boot">
(function(){
  function boot(){
    if(typeof window.render==='function'){
      try { window.render(); } catch(e) { console.error('EVO18 reload render failed:',e); }
    }
  }
  function schedule(){ setTimeout(boot,120); }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',schedule,{once:true});
  }else{
    schedule();
  }
})();
</script>
