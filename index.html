<style id="evo18-premium-motion-v2">
@media (prefers-reduced-motion: no-preference) {
  /* Consistent easing and timing for every interactive control. */
  a, button, [role="button"], .btn, .button,
  .product-card, .accessory-card, .accessories-card,
  .color-swatch, .swatch, .storage-option, .model-option,
  .nav-link, input[type="submit"], input[type="button"] {
    transition:
      transform 280ms cubic-bezier(.22,1,.36,1),
      background-color 240ms ease,
      border-color 240ms ease,
      box-shadow 280ms cubic-bezier(.22,1,.36,1),
      color 240ms ease,
      opacity 240ms ease !important;
  }

  a:not(.btn):not(.button):hover, .nav-link:hover {
    opacity: .78;
  }

  /* Catch button variants/classes that the first pass missed. */
  a.btn:hover, a.button:hover, button:hover,
  [role="button"]:hover, input[type="submit"]:hover,
  input[type="button"]:hover {
    transform: translateY(-2px);
  }

  a.btn:active, a.button:active, button:active,
  [role="button"]:active, input[type="submit"]:active,
  input[type="button"]:active {
    transform: translateY(0) scale(.985);
    transition-duration: 100ms !important;
  }

  .product-card:hover, .accessory-card:hover, .accessories-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 14px 34px rgba(0,0,0,.08);
  }

  .product-card img, .accessory-card img, .accessories-card img {
    transition: transform 420ms cubic-bezier(.22,1,.36,1) !important;
  }

  .product-card:hover img, .accessory-card:hover img, .accessories-card:hover img {
    transform: scale(1.025);
  }

  .color-swatch:hover, .swatch:hover, .storage-option:hover, .model-option:hover {
    transform: translateY(-2px);
  }

  .color-swatch:hover, .swatch:hover {
    box-shadow: 0 0 0 3px rgba(110,28,45,.12);
  }
}
</style>



<style id="evo18-inverted-cursor">

    transform:translate3d(-100px,-100px,0);
    transition:
      width .22s cubic-bezier(.22,1,.36,1),
      height .22s cubic-bezier(.22,1,.36,1),

<style id="evo18-architectural-luxury">
/* EVO18 Architectural Luxury — stronger visual identity, entirely static.
   Large tonal planes replace the barely-visible grid. */
html, body {
  background:#141213 !important;
  background-image:none !important;
}

body {
  position:relative;
  isolation:isolate;
  overflow-x:hidden;
  background:
    linear-gradient(180deg,#181617 0%,#141213 52%,#101011 100%) !important;
}

/* Large architectural planes. They deliberately have visible tonal separation,
   but remain soft enough to keep typography and product imagery dominant. */
body::before {
  content:"";
  position:absolute;
  inset:0;
  z-index:-2;
  pointer-events:none;
  background:
    linear-gradient(126deg,
      transparent 0%,
      transparent 24%,
      rgba(255,255,255,.025) 24.1%,
      rgba(255,255,255,.025) 43%,
      transparent 43.1%,
      transparent 100%
    ),
    linear-gradient(54deg,
      transparent 0%,
      transparent 54%,
      rgba(105,29,43,.075) 54.1%,
      rgba(105,29,43,.075) 71%,
      transparent 71.1%,
      transparent 100%
    ),
    linear-gradient(90deg,
      rgba(255,255,255,.018) 0%,
      rgba(255,255,255,.018) 31%,
      transparent 31.1%,
      transparent 68%,
      rgba(255,255,255,.012) 68.1%,
      rgba(255,255,255,.012) 100%
    );
}

/* Structural panel seams. */
body::after {
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    linear-gradient(90deg,
      transparent 0,
      transparent calc(31% - .5px),
      rgba(255,255,255,.08) 31%,
      transparent calc(31% + .5px),
      transparent calc(68% - .5px),
      rgba(255,255,255,.045) 68%,
      transparent calc(68% + .5px),
      transparent 100%
    ),
    linear-gradient(180deg,
      transparent 0,
      transparent 33%,
      rgba(255,255,255,.028) 33.1%,
      transparent 33.2%,
      transparent 68%,
      rgba(255,255,255,.022) 68.1%,
      transparent 68.2%,
      transparent 100%
    );
  opacity:.9;
}

/* Keep content sections visually unified. */
main > section,
.page > section,
.hero, .hero-section, .product-hero, .product-showcase,
.product-configurator, .configurator, .product-detail, .product-section,
.accessories, .accessories-section, .accessory-section,
.blog, .blog-section, .journal, .article, .article-page {
  background:transparent !important;
  background-image:none !important;
}

/* Stronger showroom floor plane beneath hero product. */
.hero::before, .hero-section::before, .product-hero::before,
.product-showcase::before, .product-configurator::before,
.configurator::before, .product-detail::before, .product-section::before {
  content:"";
  position:absolute;
  z-index:-1;
  width:min(700px,68vw);
  height:190px;
  left:50%;
  bottom:-2%;
  transform:translateX(-50%);
  background:
    linear-gradient(180deg,
      rgba(255,255,255,.025),
      rgba(255,255,255,0)
    );
  border-top:1px solid rgba(255,255,255,.045);
  border-radius:0;
  pointer-events:none;
}

/* Light-theme variant retains the same architecture. */
[data-theme="light"] body, html.light body {
  background:
    linear-gradient(180deg,#e5e0d8 0%,#ddd7ce 52%,#d4cdc3 100%) !important;
}
[data-theme="light"] body::before, html.light body::before {
  background:
    linear-gradient(126deg,
      transparent 0%, transparent 24%,
      rgba(255,255,255,.22) 24.1%,
      rgba(255,255,255,.22) 43%,
      transparent 43.1%, transparent 100%
    ),
    linear-gradient(54deg,
      transparent 0%, transparent 54%,
      rgba(105,29,43,.055) 54.1%,
      rgba(105,29,43,.055) 71%,
      transparent 71.1%, transparent 100%
    ),
    linear-gradient(90deg,
      rgba(255,255,255,.16) 0%, rgba(255,255,255,.16) 31%,
      transparent 31.1%, transparent 68%,
      rgba(255,255,255,.08) 68.1%, rgba(255,255,255,.08) 100%
    );
}
[data-theme="light"] body::after, html.light body::after {
  background:
    linear-gradient(90deg,
      transparent 0, transparent calc(31% - .5px),
      rgba(0,0,0,.07) 31%, transparent calc(31% + .5px),
      transparent calc(68% - .5px), rgba(0,0,0,.045) 68%,
      transparent calc(68% + .5px), transparent 100%
    ),
    linear-gradient(180deg,
      transparent 0, transparent 33%, rgba(0,0,0,.025) 33.1%,
      transparent 33.2%, transparent 68%, rgba(0,0,0,.02) 68.1%,
      transparent 68.2%, transparent 100%
    );
}

/* No moving effects: architecture remains GPU-light and stable. */
@media (prefers-reduced-motion: reduce) {
  body::before, body::after { opacity:.5; }
}
</style>

nBoth models use A20 Pro and the same broad Pro camera architecture, so the choice is primarily about the form factor, battery requirements, storage needs and how you prefer to use your phone.\nWho Might Prefer the Pro Max?\nThe Pro Max can be particularly relevant to customers who prioritise:\nA larger display for video, gaming and productivity\nLonger battery endurance\nLarge amounts of local storage\nA larger overall phone format\nThe smaller Pro can suit customers who want Pro capabilities in a more compact form factor.\nBefore You Buy\nCheck the exact storage and colour selected, current availability, final price, delivery terms and applicable warranty/support arrangements.\nFor an online purchase, also make sure the checkout clearly shows the complete configuration and total before you place the order.\nFinal Takeaway\nThe right iPhone 18 Pro Max configuration depends on how you use your phone. Start with the display and model preference, then choose storage based on your actual usage rather than automatically choosing the largest capacity.\n<a class="btn primary" href="#/models/pro-max">Explore iPhone 18 Pro Max</a>iPhone 18 Pro vs iPhone 18 Pro Max: What's the Difference?\nSEO Title: iPhone 18 Pro vs iPhone 18 Pro Max | EVO18\nPrimary Keyword: iPhone 18 Pro vs iPhone 18 Pro Max\nURL: /blog/iphone-18-pro-vs-pro-max\nMeta Description: Compare iPhone 18 Pro and iPhone 18 Pro Max by display, battery, storage, cameras, size and price.\nChoosing between iPhone 18 Pro and iPhone 18 Pro Max comes down to more than the name. Both models share the same Pro-generation foundation, but they differ in physical size, display size, battery endurance and the way they fit into everyday use.\niPhone 18 Pro vs Pro Max at a Glance\n| Feature | iPhone 18 Pro | iPhone 18 Pro Max |\n| Display | 6.3-inch | 6.9-inch |\n| Chip | A20 Pro | A20 Pro |\n| Camera | 48MP Pro Fusion system | 48MP Pro Fusion system |\n| Front camera | 18MP Center Stage | 18MP Center Stage |\n| Storage | 256GB–2TB | 256GB–2TB |\n| Battery rating | Up to 24 hrs typical use / 36 hrs video playback | Up to 30 hrs typical use / 45 hrs video playback |\n| Starting EVO18 demo price | LKR 499,900 | LKR 529,900 |\nDisplay Size\nThe clearest difference is the display. The iPhone 18 Pro has a 6.3-inch Super Retina XDR OLED display, while the Pro Max has a 6.9-inch display.\nA larger screen can be useful for watching video, gaming, editing photos and working with apps where additional screen area is helpful. The smaller Pro provides the same generation's core Pro platform in a more compact form.\nPerformance\nBoth models use A20 Pro. That means the decision between them is not based on choosing a different performance tier within the Pro generation.\nBoth are designed for demanding applications, gaming, photography, video workflows and on-device intelligence.\nCameras\nBoth models feature a 48MP Pro Fusion camera system comprising a 48MP Fusion Main camera with variable aperture, a 48MP Fusion Ultra Wide and a 48MP Fusion Telephoto.\nFor someone choosing between the two, the camera system therefore isn't the simplest reason to separate them. The more meaningful considerations are size, battery, storage and handling.\nBattery\nApple rates iPhone 18 Pro for up to 24 hours of typical use and up to 36 hours of video playback. iPhone 18 Pro Max is rated for up to 30 hours of typical use and up to 45 hours of video playback.\nActual battery life depends on network conditions, settings, applications and usage.\nStorage\nBoth models are available in 256GB, 512GB, 1TB and 2TB configurations in the EVO18 catalogue.\nChoose based on how much content you expect to keep locally. Someone who mainly streams and uses cloud storage may not need the largest capacity, while a heavy video creator may value additional space.\nWhich One Fits Your Use?\nThe iPhone 18 Pro may suit someone who wants a smaller Pro form factor while retaining the latest Pro features.\nThe iPhone 18 Pro Max may suit someone who prefers a larger screen and places greater emphasis on battery endurance and maximum storage.\nThere is no single configuration that suits every customer. The better match depends on your priorities.\n<a class="btn primary" href="#/compare">Compare iPhone 18 Pro Models</a>iPhone 18 Pro Storage Guide: 256GB vs 512GB vs 1TB vs 2TB\nSEO Title: iPhone 18 Pro Storage Guide: 256GB vs 512GB vs 1TB vs 2TB | EVO18\nPrimary Keyword: iPhone 18 Pro storage\nURL: /blog/iphone-18-pro-storage-guide\nMeta Description: Understand iPhone 18 Pro storage options from 256GB to 2TB and choose the capacity that fits your photos, video, apps and files.\nStorage is one of the biggest decisions when buying an iPhone because you cannot normally add internal storage later. The right capacity depends on what you keep on your phone, how often you record video and whether you rely on cloud storage.\nThe iPhone 18 Pro and iPhone 18 Pro Max are offered in four storage configurations in the EVO18 catalogue: 256GB, 512GB, 1TB and 2TB.\n256GB: A Practical Starting Point\n256GB is a sensible starting capacity for many everyday users.\nIt can accommodate a substantial collection of photographs, apps, messages, downloads and other files. Customers who regularly use cloud storage and stream content instead of storing everything locally may find this capacity practical.\nEVO18 demo price for iPhone 18 Pro: **LKR 499,900**.\n512GB: More Room for Photos and Video\n512GB doubles the capacity of the 256GB configuration.\nIt is useful for people who capture a lot of photographs and video, download media for offline use, install larger applications and prefer to keep more content on the device.\nEVO18 demo price for iPhone 18 Pro: **LKR 579,900**.\n1TB: For Large Local Libraries\n1TB provides substantially more room for large media libraries and demanding workflows.\nIt can make sense for creators, professionals and users who regularly handle large video files or want to keep extensive content locally.\nEVO18 demo price for iPhone 18 Pro: **LKR 699,900**.\n2TB: Maximum Capacity\n2TB is the highest storage configuration in the EVO18 catalogue.\nIt is most relevant to users with exceptionally large local libraries or professional workflows involving substantial amounts of media.\nEVO18 demo price for iPhone 18 Pro: **LKR 899,900**.\nWhat About iPhone 18 Pro Max?\nThe Pro Max follows the same storage range:\n256GB — LKR 529,900\n512GB — LKR 609,900\n1TB — LKR 729,900\n2TB — LKR 929,900\nThe best way to compare the prices is to select the model and storage together because the Pro Max has a different base price.\nDo You Need 1TB or 2TB?\nNot necessarily.\nIf your phone is mainly used for communication, photography, social media, streaming and ordinary apps, 256GB or 512GB may be sufficient.\nHigher capacities become more relevant when you regularly shoot and retain large amounts of high-resolution video, work with large files or prefer to keep most of your content locally.\nA Simple Way to Decide\nAsk yourself three questions:\n1. How much storage is your current phone using?\n2. How quickly are you filling it?\n3. Do you regularly delete or move large files?\nIf your current device is already close to full, moving to the next capacity can provide more useful headroom.\n\n5. iPhone 18 Pro Colours: Complete Guide to the Available Finishes\nSEO Title: iPhone 18 Pro Colours: Black, Silver, Glacier & Burgundy | EVO18\nPrimary Keyword: iPhone 18 Pro colours\nURL: /blog/iphone-18-pro-colours\nMeta Description: Explore the iPhone 18 Pro colours available through EVO18, including Black, Silver, Glacier and Burgundy.\nThe colour you choose is one of the most visible parts of your new iPhone. The iPhone 18 Pro generation is presented in four finishes: Black, Silver, Glacier and Burgundy.\nAll four give the Pro range a different visual character, while the underlying phone configuration remains the same apart from the selected model and storage.\nBlack\nBlack is the understated option rage, warranty terms, return policy and contact details.\n\nA specialist retailer can be particularly useful when you want advice on comparing models or configurations, but the specific services offered will vary from business to business.\n3. Online iPhone Retailers\nOnline retailers can make it easier to compare models, storage capacities and prices without visiting a physical shop.\n\nHowever, buying online means you should pay particular attention to the information presented before checkout. A trustworthy online buying experience should make it clear who the seller is, how to contact them, what product you are receiving, how delivery works and what happens if there is a problem with the order.\n\nBefore paying, review the seller's terms and make sure the final price and selected configuration are clearly displayed.\n4. Imported or Grey-Market Devices\nSri Lankan customers may also encounter imported devices sold outside an authorised local retail channel. These products can sometimes be offered at different prices or with different availability.\n\nThat does not by itself tell you whether a particular purchase is suitable. Instead, check the details that affect your ownership experience: the exact model and region, warranty coverage, compatibility, return terms, invoice, activation status and after-sales support.\n\nIf a price is significantly different from other listings, ask why before making the purchase.\nWhat Should You Check Before Buying an iPhone?\nWhether you are buying from a physical retailer or online, use a simple checklist before you pay:\nIs the device new, used, refurbished or otherwise previously activated?\nWhat is the exact iPhone model and storage capacity?\nWhich colour and configuration are you receiving?\nWhat warranty applies, and who provides it?\nWhat is the return and exchange policy?\nIs the advertised price the final price?\nAre delivery charges included?\nWill you receive a proper invoice or proof of purchase?\nHow can you contact the seller if something goes wrong?\nIf the device is imported, what regional or model-specific considerations should you know about?\nPrice Is Only One Part of the Purchase\nThe lowest advertised price is not necessarily the lowest-risk purchase. Compare the complete package: the device itself, warranty, return terms, delivery, payment arrangements, customer support and the seller's transparency.\nWhy Consider EVO18?\nEVO18 is designed around a focused iPhone buying experience in Sri Lanka. Customers can explore iPhone 18 Pro and iPhone 18 Pro Max, compare configurations, select storage and colour, review the applicable price and contact the EVO18 team before ordering.\nThe goal is to make the process easier to understand: know the model, know the configuration, know the price and know the terms before you buy.\n<a class="btn primary" href="#/models/pro">Explore iPhone 18 Pro</a>"const completionLink=complete.querySelector('a');

const EVO18_FULL_BLOGS=[["iPhone 18 Pro Price in Sri Lanka: Complete Guide", "iPhone 18 Pro Price in Sri Lanka: Complete Guide\nSEO Title: iPhone 18 Pro Price in Sri Lanka | EVO18\nPrimary Keyword: iPhone 18 Pro price in Sri Lanka\nURL: /blog/iphone-18-pro-price-sri-lanka\nMeta Description: Explore iPhone 18 Pro pricing in Sri Lanka, storage options, colours, key features and what to consider before buying.\nIf you're looking for the iPhone 18 Pro price in Sri Lanka, the first thing to know is that the final price depends on the exact configuration you choose. Storage capacity, availability, seller, payment method and the applicable warranty or service arrangement can all affect the amount you pay.\nAt EVO18, the buying experience is built around making that choice clear. You can select the iPhone 18 Pro, choose your storage and colour, review the applicable price and then continue with your order.\niPhone 18 Pro Price in Sri Lanka\nFor the EVO18 project, the current portfolio pricing is structured by storage:\n| Storage | EVO18 Demo Price |\n| 256GB | LKR 499,900 |\n| 512GB | LKR 579,900 |\n| 1TB | LKR 699,900 |\n| 2TB | LKR 899,900 |\nThese figures are project/demo prices informed by Sri Lankan market references and are not presented as an official Apple Sri Lanka price. Retail pricing can change, so the live EVO18 product page should always be treated as the source of the current selling price.\nWhich Storage Option Should You Choose?\nThe 256GB configuration is a practical starting point for customers who mainly use their phone for photography, social media, messaging, streaming, apps and everyday files.\nMoving to 512GB gives you considerably more room for photos, videos, apps and offline content. It can be useful if you regularly capture high-resolution media or prefer to keep a larger amount of content stored locally.\nThe 1TB option is aimed at customers who work with large files, shoot substantial amounts of video, use demanding creative applications or simply want a large local library.\n2TB provides the maximum storage configuration in this EVO18 catalogue. It is most relevant to customers who have unusually large photo, video or file libraries and want to minimise the need to manage storage.\niPhone 18 Pro Colours\nThe iPhone 18 Pro is presented in four finishes:\nBlack\nSilver\nGlacier\nBurgundy\nColour does not change the base storage price in the EVO18 pricing model unless a specific configuration has a different live price or availability.\nWhat Makes iPhone 18 Pro a Pro Model?\niPhone 18 Pro combines A20 Pro performance with a 48MP Pro Fusion camera system, a variable-aperture Main camera, ProMotion display technology and advanced Apple Intelligence capabilities, subject to supported languages, regions and system requirements.\nIt is designed for a broad range of uses, from everyday photography and communication to gaming, professional applications and creative workflows.\nBuying an iPhone 18 Pro in Sri Lanka\nBefore ordering, check the exact model, storage, colour, current price, availability, warranty terms and delivery conditions. These details are more useful than relying on a single headline price.\nAt EVO18, the product configurator should update the displayed price as you change storage and should show the selected configuration before checkout.\nFinal Takeaway\nThere isn't one universal iPhone 18 Pro price because different configurations and market conditions produce different prices. The most useful way to compare options is to start with the model you want, decide how much storage you actually need and then compare the complete configuration.\n\n2."], ["iPhone 18 Pro Max Price in Sri Lanka: Storage & Buying Guide", "iPhone 18 Pro Max Price in Sri Lanka: Storage & Buying Guide\nSEO Title: iPhone 18 Pro Max Price in Sri Lanka | EVO18\nPrimary Keyword: iPhone 18 Pro Max price in Sri Lanka\nURL: /blog/iphone-18-pro-max-price-sri-lanka\nMeta Description: See iPhone 18 Pro Max pricing in Sri Lanka by storage, compare configurations and learn what to check before ordering.\nThe iPhone 18 Pro Max is the larger model in Apple's latest Pro generation. For customers researching the iPhone 18 Pro Max price in Sri Lanka, the most important comparison is not simply the starting price but the exact storage configuration and the conditions attached to the purchase.\nEVO18 is designed to show those choices clearly before checkout.\niPhone 18 Pro Max Price in Sri Lanka\nEVO18's project pricing is structured as follows:\n| Storage | EVO18 Demo Price |\n| 256GB | LKR 529,900 |\n| 512GB | LKR 609,900 |\n| 1TB | LKR 729,900 |\n| 2TB | LKR 929,900 |\nThese are rounded project/demo prices benchmarked against Sri Lankan retailer references. They should be treated as mockup pricing until EVO18 confirms its actual commercial pricing.\nWhy Does Storage Change the Price?\nHigher storage configurations cost more because they provide more built-in capacity for applications, photographs, videos, games and other files.\nFor many customers, 256GB can be enough. If you regularly record video, download large files or keep extensive content on your phone, 512GB or 1TB may provide more breathing room.\n2TB is intended for customers who want the maximum available capacity and regularly manage very large local files.\nPro Max or Pro?\nThe biggest physical difference is the display size. iPhone 18 Pro Max has a 6.9-inch display, while iPhone 18 Pro has a 6.3-inch display.\nBoth models use A20 Pro and the same broad Pro camera architecture, so the choice is primarily about the form factor, battery requirements, storage needs and how you prefer to use your phone.\nWho Might Prefer the Pro Max?\nThe Pro Max can be particularly relevant to customers who prioritise:\nA larger display for video, gaming and productivity\nLonger battery endurance\nLarge amounts of local storage\nA larger overall phone format\nThe smaller Pro can suit customers who want Pro capabilities in a more compact form factor.\nBefore You Buy\nCheck the exact storage and colour selected, current availability, final price, delivery terms and applicable warranty/support arrangements.\nFor an online purchase, also make sure the checkout clearly shows the complete configuration and total before you place the order.\nFinal Takeaway\nThe right iPhone 18 Pro Max configuration depends on how you use your phone. Start with the display and model preference, then choose storage based on your actual usage rather than automatically choosing the largest capacity.\n Max\n3."], ["iPhone 18 Pro vs iPhone 18 Pro Max: What's the Difference?", "iPhone 18 Pro vs iPhone 18 Pro Max: What's the Difference?\nSEO Title: iPhone 18 Pro vs iPhone 18 Pro Max | EVO18\nPrimary Keyword: iPhone 18 Pro vs iPhone 18 Pro Max\nURL: /blog/iphone-18-pro-vs-pro-max\nMeta Description: Compare iPhone 18 Pro and iPhone 18 Pro Max by display, battery, storage, cameras, size and price.\nChoosing between iPhone 18 Pro and iPhone 18 Pro Max comes down to more than the name. Both models share the same Pro-generation foundation, but they differ in physical size, display size, battery endurance and the way they fit into everyday use.\niPhone 18 Pro vs Pro Max at a Glance\n| Feature | iPhone 18 Pro | iPhone 18 Pro Max |\n| Display | 6.3-inch | 6.9-inch |\n| Chip | A20 Pro | A20 Pro |\n| Camera | 48MP Pro Fusion system | 48MP Pro Fusion system |\n| Front camera | 18MP Center Stage | 18MP Center Stage |\n| Storage | 256GB–2TB | 256GB–2TB |\n| Battery rating | Up to 24 hrs typical use / 36 hrs video playback | Up to 30 hrs typical use / 45 hrs video playback |\n| Starting EVO18 demo price | LKR 499,900 | LKR 529,900 |\nDisplay Size\nThe clearest difference is the display. The iPhone 18 Pro has a 6.3-inch Super Retina XDR OLED display, while the Pro Max has a 6.9-inch display.\nA larger screen can be useful for watching video, gaming, editing photos and working with apps where additional screen area is helpful. The smaller Pro provides the same generation's core Pro platform in a more compact form.\nPerformance\nBoth models use A20 Pro. That means the decision between them is not based on choosing a different performance tier within the Pro generation.\nBoth are designed for demanding applications, gaming, photography, video workflows and on-device intelligence.\nCameras\nBoth models feature a 48MP Pro Fusion camera system comprising a 48MP Fusion Main camera with variable aperture, a 48MP Fusion Ultra Wide and a 48MP Fusion Telephoto.\nFor someone choosing between the two, the camera system therefore isn't the simplest reason to separate them. The more meaningful considerations are size, battery, storage and handling.\nBattery\nApple rates iPhone 18 Pro for up to 24 hours of typical use and up to 36 hours of video playback. iPhone 18 Pro Max is rated for up to 30 hours of typical use and up to 45 hours of video playback.\nActual battery life depends on network conditions, settings, applications and usage.\nStorage\nBoth models are available in 256GB, 512GB, 1TB and 2TB configurations in the EVO18 catalogue.\nChoose based on how much content you expect to keep locally. Someone who mainly streams and uses cloud storage may not need the largest capacity, while a heavy video creator may value additional space.\nWhich One Fits Your Use?\nThe iPhone 18 Pro may suit someone who wants a smaller Pro form factor while retaining the latest Pro features.\nThe iPhone 18 Pro Max may suit someone who prefers a larger screen and places greater emphasis on battery endurance and maximum storage.\nThere is no single configuration that suits every customer. The better match depends on your priorities.\n\n4."], ["iPhone 18 Pro Storage Guide: 256GB vs 512GB vs 1TB vs 2TB", "iPhone 18 Pro Storage Guide: 256GB vs 512GB vs 1TB vs 2TB\nSEO Title: iPhone 18 Pro Storage Guide: 256GB vs 512GB vs 1TB vs 2TB | EVO18\nPrimary Keyword: iPhone 18 Pro storage\nURL: /blog/iphone-18-pro-storage-guide\nMeta Description: Understand iPhone 18 Pro storage options from 256GB to 2TB and choose the capacity that fits your photos, video, apps and files.\nStorage is one of the biggest decisions when buying an iPhone because you cannot normally add internal storage later. The right capacity depends on what you keep on your phone, how often you record video and whether you rely on cloud storage.\nThe iPhone 18 Pro and iPhone 18 Pro Max are offered in four storage configurations in the EVO18 catalogue: 256GB, 512GB, 1TB and 2TB.\n256GB: A Practical Starting Point\n256GB is a sensible starting capacity for many everyday users.\nIt can accommodate a substantial collection of photographs, apps, messages, downloads and other files. Customers who regularly use cloud storage and stream content instead of storing everything locally may find this capacity practical.\nEVO18 demo price for iPhone 18 Pro: **LKR 499,900**.\n512GB: More Room for Photos and Video\n512GB doubles the capacity of the 256GB configuration.\nIt is useful for people who capture a lot of photographs and video, download media for offline use, install larger applications and prefer to keep more content on the device.\nEVO18 demo price for iPhone 18 Pro: **LKR 579,900**.\n1TB: For Large Local Libraries\n1TB provides substantially more room for large media libraries and demanding workflows.\nIt can make sense for creators, professionals and users who regularly handle large video files or want to keep extensive content locally.\nEVO18 demo price for iPhone 18 Pro: **LKR 699,900**.\n2TB: Maximum Capacity\n2TB is the highest storage configuration in the EVO18 catalogue.\nIt is most relevant to users with exceptionally large local libraries or professional workflows involving substantial amounts of media.\nEVO18 demo price for iPhone 18 Pro: **LKR 899,900**.\nWhat About iPhone 18 Pro Max?\nThe Pro Max follows the same storage range:\n256GB — LKR 529,900\n512GB — LKR 609,900\n1TB — LKR 729,900\n2TB — LKR 929,900\nThe best way to compare the prices is to select the model and storage together because the Pro Max has a different base price.\nDo You Need 1TB or 2TB?\nNot necessarily.\nIf your phone is mainly used for communication, photography, social media, streaming and ordinary apps, 256GB or 512GB may be sufficient.\nHigher capacities become more relevant when you regularly shoot and retain large amounts of high-resolution video, work with large files or prefer to keep most of your content locally.\nA Simple Way to Decide\nAsk yourself three questions:\n1. How much storage is your current phone using?\n2. How quickly are you filling it?\n3. Do you regularly delete or move large files?\nIf your current device is already close to full, moving to the next capacity can provide more useful headroom.\n\n5."], ["iPhone 18 Pro Colours: Complete Guide to the Available Finishes", "iPhone 18 Pro Colours: Complete Guide to the Available Finishes\nSEO Title: iPhone 18 Pro Colours: Black, Silver, Glacier & Burgundy | EVO18\nPrimary Keyword: iPhone 18 Pro colours\nURL: /blog/iphone-18-pro-colours\nMeta Description: Explore the iPhone 18 Pro colours available through EVO18, including Black, Silver, Glacier and Burgundy.\nThe colour you choose is one of the most visible parts of your new iPhone. The iPhone 18 Pro generation is presented in four finishes: Black, Silver, Glacier and Burgundy.\nAll four give the Pro range a different visual character, while the underlying phone configuration remains the same apart from the selected model and storage.\nBlack\nBlack is the understated option for customers who prefer a darker, minimalist appearance.\nIt pairs easily with a wide range of cases and accessories and gives the phone a classic look.\nSilver\nSilver offers a clean, bright finish that highlights the phone's refined Pro design.\nIt is a versatile choice for customers who prefer a lighter appearance.\nGlacier\nGlacier provides a cooler, more distinctive finish while maintaining the understated character expected from a Pro device.\nIt can be a good choice for customers who want something different without choosing a very dark or highly saturated colour.\nBurgundy\nBurgundy is the more expressive option in the range.\nIts deeper tone gives the iPhone a stronger visual identity and can make the device stand out more, particularly when used without a case.\nDoes Colour Affect Price?\nIn the EVO18 pricing structure, the listed storage configuration determines the base price. Colour should not automatically change the price unless a specific configuration has a different live price or availability.\nFor example, selecting Burgundy should not change the price simply because it is Burgundy. The website should calculate the price from the actual model and storage variant selected.\nWhich Colour Should You Choose?\nColour is ultimately a personal preference. Consider how often you use a case, whether you prefer a subtle or distinctive finish and which colour you are likely to enjoy throughout the life of the device.\nThe important thing is to choose the finish you actually want rather than selecting based solely on what is currently most visible online.\nSee the Colours\nEVO18 should display high-quality images of all four finishes and allow customers to select a colour directly from the product configurator.\nWhen a customer selects a colour, the product image should update to show the corresponding finish while the selected model, storage, price and availability remain visible.\n Colours\nBlog Publishing & SEO Notes\nPublish these five articles as the initial EVO18 Journal. The older short topic list should be treated as a future content roadmap, not as published blog copy. Each article should link to its corresponding product/comparison page, use one clear canonical URL, display a publication date and last-reviewed date where pricing or specifications can change, and include a real author/byline. Keep pricing and product claims synchronized with the live product catalogue.\n6."], ["Where to Buy an iPhone in Sri Lanka: A Guide to Choosing the Right Seller", "Where to Buy an iPhone in Sri Lanka: A Guide to Choosing the Right Seller\nSEO Title: Where to Buy an iPhone in Sri Lanka | EVO18\nPrimary Keyword: where to buy iPhone in Sri Lanka\nSecondary Keywords: best place to buy iPhone in Sri Lanka; iPhone shops in Sri Lanka; buy iPhone Sri Lanka; genuine iPhone Sri Lanka; iPhone dealers Sri Lanka; iPhone Colombo\nSuggested URL: /blog/where-to-buy-iphone-sri-lanka\nMeta Description: Looking for where to buy an iPhone in Sri Lanka? Learn what to check when comparing Apple retailers, specialists and online sellers before you buy.\nBuying an iPhone in Sri Lanka\nBuying a new iPhone is a significant purchase, and the seller you choose can matter just as much as the model you choose. Prices, availability, warranty arrangements, delivery options and after-sales support can vary between sellers.\n\nIf you're searching for where to buy an iPhone in Sri Lanka, it helps to compare the complete purchase rather than looking only at the headline price.\n\nThis guide explains the main types of sellers you may encounter and the questions worth asking before placing an order.\n1. Apple-Authorised Retailers\nApple-authorised retailers operate within Apple's authorised retail and service ecosystem, subject to the relevant requirements of the programme.\n\nFor customers, one reason to consider an authorised retailer is the clarity around the applicable manufacturer support and warranty arrangements. If this matters to you, confirm exactly what warranty applies to the specific device before purchasing.\n\nAuthorisation status should be verified directly rather than assumed because a retailer sells Apple products.\n2. Established Apple Specialists\nSome Sri Lankan retailers specialise heavily in Apple products. A specialist may offer several iPhone configurations and related products or services.\n\nWhen comparing a specialist retailer, look beyond the product price. Check whether the seller clearly states the device condition, exact model, storage, warranty terms, return policy and contact details.\n\nA specialist retailer can be particularly useful when you want advice on comparing models or configurations, but the specific services offered will vary from business to business.\n3. Online iPhone Retailers\nOnline retailers can make it easier to compare models, storage capacities and prices without visiting a physical shop.\n\nHowever, buying online means you should pay particular attention to the information presented before checkout. A trustworthy online buying experience should make it clear who the seller is, how to contact them, what product you are receiving, how delivery works and what happens if there is a problem with the order.\n\nBefore paying, review the seller's terms and make sure the final price and selected configuration are clearly displayed.\n4. Imported or Grey-Market Devices\nSri Lankan customers may also encounter imported devices sold outside an authorised local retail channel. These products can sometimes be offered at different prices or with different availability.\n\nThat does not by itself tell you whether a particular purchase is suitable. Instead, check the details that affect your ownership experience: the exact model and region, warranty coverage, compatibility, return terms, invoice, activation status and after-sales support.\n\nIf a price is significantly different from other listings, ask why before making the purchase.\nWhat Should You Check Before Buying an iPhone?\nWhether you are buying from a physical retailer or online, use a simple checklist before you pay:\nIs the device new, used, refurbished or otherwise previously activated?\nWhat is the exact iPhone model and storage capacity?\nWhich colour and configuration are you receiving?\nWhat warranty applies, and who provides it?\nWhat is the return and exchange policy?\nIs the advertised price the final price?\nAre delivery charges included?\nWill you receive a proper invoice or proof of purchase?\nHow can you contact the seller if something goes wrong?\nIf the device is imported, what regional or model-specific considerations should you know about?\nPrice Is Only One Part of the Purchase\nThe lowest advertised price is not necessarily the lowest-risk purchase. Compare the complete package: the device itself, warranty, return terms, delivery, payment arrangements, customer support and the seller's transparency.\nWhy Consider EVO18?\nEVO18 is designed around a focused iPhone buying experience in Sri Lanka. Customers can explore iPhone 18 Pro and iPhone 18 Pro Max, compare configurations, select storage and colour, review the applicable price and contact the EVO18 team before ordering.\nThe goal is to make the process easier to understand: know the model, know the configuration, know the price and know the terms before you buy.\n | Compare Models | Contact EVO18\nInternal Links for This Article\niPhone 18 Pro product page\niPhone 18 Pro Max product page\nCompare Models page\nWarranty page\nDelivery page\nFAQ page\nContact EVO18\nPublishing note: This article should be reviewed whenever EVO18's seller information, warranty arrangements, delivery terms or product catalogue changes. Do not describe EVO18 as Apple-authorised unless that status is independently verified."]];

<script id="evo18-smooth-price">
(function(){
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const selectors = [
    '.price', '.product-price', '.config-price',
    '[class*="price"]', '[id*="price"]'
  ];

  let locked = false;
  const observer = new MutationObserver(function(mutations){
    if (locked) return;
    const changed = new Set();

    mutations.forEach(function(m){
      let el = m.target.nodeType === 1 ? m.target : m.target.parentElement;
      if (!el) return;
      let price = el.closest ? el.closest(selectors.join(',')) : null;
      if (!price && el.matches && selectors.some(s => { try{return el.matches(s)}catch(e){return false} })) price = el;
      if (price) changed.add(price);
    });

    if (!changed.size) return;
    locked = true;

    changed.forEach(function(price){
      price.animate([
        { opacity: 1, transform: 'translateY(0)' },
        { opacity: .72, transform: 'translateY(-2px)' },
        { opacity: 1, transform: 'translateY(0)' }
      ], {
        duration: 360,
        easing: 'cubic-bezier(.22,1,.36,1)'
      });
    });

    setTimeout(function(){ locked=false; }, 380);
  });

  observer.observe(document.body, {
    subtree:true,
    childList:true,
    characterData:true
  });
})();
</script>



<script id="evo18-inverted-cursor-js">
(function(){
  if (!window.matchMedia ||
      !window.matchMedia('(pointer:fine)').matches ||
      window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const dot=document.createElement('div');
  dot.id='evo18-cursor-dot';
  document.body.appendChild(dot);

  let x=-100,y=-100,tx=-100,ty=-100;

  function frame(){
    x+=(tx-x)*.2;
    y+=(ty-y)*.2;
    dot.style.transform='translate3d('+x+'px,'+y+'px,0)';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  document.addEventListener('mousemove',function(e){
    tx=e.clientX; ty=e.clientY;

    const interactive=e.target.closest(
      'a,button,[role="button"],input,select,summary,.btn,.button,'+
      '.color-swatch,.swatch,.storage-option,.model-option'
    );
    const product=e.target.closest(
      '.product-card,.accessory-card,.accessories-card,[data-product]'
    );

    dot.classList.toggle('is-hover',!!interactive && !product);
    dot.classList.toggle('is-product',!!product);
  },{passive:true});

  document.addEventListener('mouseleave',()=>dot.style.opacity='0');
  document.addEventListener('mouseenter',()=>dot.style.opacity='1');
})();
</script>

<script id="evo18-scan-game-js">
(function(){
function initScan(){
  const trigger=document.getElementById('evo18-scan-trigger');
  const overlay=document.getElementById('evo18-scan-overlay');
  const complete=document.getElementById('evo18-scan-complete');
  if(!trigger||!overlay||!complete)return;

  const hud=overlay.querySelector('#evo18-scan-hud');
  const cursor=overlay.querySelector('#evo18-scan-cursor');
  let active=false,found=0,startedAt=0,raf=0,toastTimer=null;
  let best=Number(localStorage.getItem('evo18ScanBest')||0);

  function resetHud(){
    hud.innerHTML='EVO18 SCAN · <span class="evo18-count">0 / 5</span><span class="evo18-timer">00.00</span>';
    return {
      count:hud.querySelector('.evo18-count'),
      timer:hud.querySelector('.evo18-timer')
    };
  }
  let ui=resetHud();

  function tick(){
    if(!active)return;
    ui.timer.textContent=((performance.now()-startedAt)/1000).toFixed(2);
    raf=requestAnimationFrame(tick);
  }

  function move(e){
    if(!active)return;
    cursor.style.left=e.clientX+'px';
    cursor.style.top=e.clientY+'px';
    overlay.querySelectorAll('.evo18-scan-target:not(.found)').forEach(function(t){
      const r=t.getBoundingClientRect();
      const d=Math.hypot(
        e.clientX-(r.left+r.width/2),
        e.clientY-(r.top+r.height/2)
      );
      t.classList.toggle('near',d<120);
    });
  }

  function buildTargets(){
    overlay.querySelectorAll('.evo18-scan-target').forEach(function(t){t.remove();});
    const spots=[];
    let tries=0;
    while(spots.length<5 && tries++<1000){
      const x=10+Math.random()*80;
      const y=16+Math.random()*72;
      if(spots.every(function(p){return Math.hypot(x-p[0],y-p[1])>15;})){
        spots.push([x,y]);
      }
    }
    spots.forEach(function(p,i){
      const t=document.createElement('button');
      t.type='button';
      t.className='evo18-scan-target';
      t.style.left=p[0]+'%';
      t.style.top=p[1]+'%';
      t.setAttribute('aria-label','Scan marker '+(i+1));
      t.addEventListener('click',function(e){
        e.preventDefault();
        e.stopPropagation();
        if(!active || t.classList.contains('found'))return;
        t.classList.add('found');
        found++;
        ui.count.textContent=found+' / 5';
        if(found===5)finish();
      });
      overlay.appendChild(t);
    });
  }

  function hideToast(){
    if(toastTimer){
      clearTimeout(toastTimer);
      toastTimer=null;
    }
    complete.classList.add('closing');
    complete.classList.remove('show');
    setTimeout(function(){
      complete.style.visibility='hidden';
      complete.classList.remove('closing');
    },220);
  }

  function stopScan(){
    active=false;
    overlay.classList.remove('active');
    trigger.classList.remove('is-active');
    document.body.style.cursor='';
    cursor.style.opacity='0';
    window.removeEventListener('mousemove',move);
    if(raf){
      cancelAnimationFrame(raf);
      raf=0;
    }
  }

  function startScan(){
    hideToast();
    found=0;
    ui=resetHud();
    buildTargets();
    active=true;
    startedAt=performance.now();
    trigger.classList.add('is-active');
    overlay.classList.add('active');
    cursor.style.opacity='1';
    document.body.style.cursor='none';
    window.addEventListener('mousemove',move,{passive:true});
    raf=requestAnimationFrame(tick);
  }

  function finish(){
    const elapsed=(performance.now()-startedAt)/1000;
    stopScan();

    const timeEl=complete.querySelector('.evo18-result-time');
    const recordEl=complete.querySelector('.evo18-record');
    timeEl.textContent=elapsed.toFixed(2)+'s';
    recordEl.classList.remove('record-new');

    if(!best || elapsed<best){
      best=elapsed;
      localStorage.setItem('evo18ScanBest',String(best));
      recordEl.textContent='NEW RECORD';
      recordEl.classList.add('record-new');
    }else{
      recordEl.textContent='BEST · '+best.toFixed(2)+'s';
    }

    complete.style.visibility='visible';
    complete.classList.remove('closing');
    void complete.offsetWidth;
    complete.classList.add('show');

    if(toastTimer)clearTimeout(toastTimer);
    toastTimer=setTimeout(hideToast,6000);
  }

  trigger.addEventListener('click',function(e){
    e.preventDefault();
    e.stopPropagation();
    if(active){
      stopScan();
    }else{
      startScan();
    }
  });

  const closeBtn=complete.querySelector('.evo18-toast-close');
  const retryBtn=complete.querySelector('.evo18-toast-retry');

  if(closeBtn){
    closeBtn.addEventListener('click',function(e){
      e.preventDefault();
      e.stopPropagation();
      hideToast();
    });
  }

  if(retryBtn){
    retryBtn.addEventListener('click',function(e){
      e.preventDefault();
      e.stopPropagation();
      hideToast();
      setTimeout(startScan,220);
    });
  }
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',initScan,{once:true});
}else{
  initScan();
}
})();
</script>

(function(){

  ];

  function panel(){return document.getElementById('evo18-search-panel')}
  function input(){return document.getElementById('evo18-search-input')}
  function closeSearch(){
    const p=panel();
    if(!p)return;
    p.classList.remove('open');
    p.setAttribute('aria-hidden','true');
  }
  function renderResults(q){
    const box=document.getElementById('evo18-search-results');
    if(!box)return;
    const query=(q||'').trim().toLowerCase();
    const matches=query ? items.filter(x=>(x[0]+' '+x[2]).toLowerCase().includes(query)) : items.slice(0,6);
    if(!matches.length){
      box.innerHTML='<div class="evo18-search-empty">No results found</div>';
      return;
    }
    box.innerHTML=matches.map(x=>
      '<a class="evo18-search-result" href="'+x[1]+'"><span>'+x[0]+'</span><small>'+x[2]+'</small><b>→</b></a>'
    ).join('');
    box.querySelectorAll('.evo18-search-result').forEach(a=>{
      a.addEventListener('click',function(){closeSearch();});
    });
  }

  window.toggleEvoSearch=function(){
    const p=panel(), i=input();
    if(!p||!i)return;
    const open=p.classList.toggle('open');
    p.setAttribute('aria-hidden',open?'false':'true');
    if(open){
      i.value='';
      renderResults('');
      requestAnimationFrame(()=>i.focus());
    }
  };

  document.addEventListener('DOMContentLoaded',function(){
    const i=input(), c=document.getElementById('evo18-search-close');
    if(i)i.addEventListener('input',()=>renderResults(i.value));
    if(i)i.addEventListener('keydown',function(e){
      if(e.key==='Escape')closeSearch();
      if(e.key==='Enter'){
        const first=document.querySelector('.evo18-search-result');
        if(first)first.click();
      }
    });
    if(c)c.addEventListener('click',closeSearch);
  });

  document.addEventListener('keydown',function(e){
    if(e.key==='/' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){
      e.preventDefault();
      const p=panel();
      if(p && !p.classList.contains('open'))window.toggleEvoSearch();
    }
    if(e.key==='Escape')closeSearch();
  });
})();
</script>
